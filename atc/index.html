:root {
  --ui: 1;
  --bg: #07090c; --bg2: #0c1016; --panel: #0f141b; --panel2: #141a23; --line: #1f2833; --line2: #2a3644;
  --tx: #d7e0ea; --tx2: #8d9bab; --tx3: #5b6878;
  --acc: #4fd1a5; --acc2: #2a8f6e; --sel: #ffd84a; --warn: #ffb43a; --alert: #ff4d42; --blue: #6cb6ff; --violet: #b99cff;
  --mono: "Plex Mono", ui-monospace, Menlo, Consolas, monospace; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: calc(13px * var(--ui)); --fs-s: calc(11.5px * var(--ui)); --fs-xs: calc(10.5px * var(--ui));
  --side: clamp(300px, 24vw, 520px);
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: var(--fs)/1.4 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #232c38; border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
#main { display: grid; grid-template-columns: 1fr var(--side); min-height: 0; }
#scopeCol { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
#scope { position: relative; overflow: hidden; background: #000; min-height: 0; cursor: crosshair; user-select: none; }
#scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scope.panning { cursor: grabbing; }
#scope.hover { cursor: pointer; }

/* ---------- top bar ---------- */
#top { display: flex; align-items: stretch; gap: 0; height: calc(46px * var(--ui)); background: linear-gradient(#10151c, #0b0f14); border-bottom: 1px solid var(--line); overflow: hidden; }
#top .cell { display: flex; flex-direction: column; justify-content: center; padding: 0 12px; border-right: 1px solid var(--line); white-space: nowrap; min-width: 0; }
#top .cell.grow { flex: 1; overflow: hidden; }
#top .lab { font-size: var(--fs-xs); color: var(--tx3); letter-spacing: .08em; text-transform: uppercase; }
#top .val { font-family: var(--mono); font-size: calc(14px * var(--ui)); font-weight: 600; }
#top .val.big { font-size: calc(17px * var(--ui)); }
#top .brand { flex-direction: row; align-items: center; gap: 10px; }
#top .brand b { font-family: var(--mono); color: var(--acc); font-size: calc(15px * var(--ui)); letter-spacing: .04em; }
#top .brand span { color: var(--tx2); font-size: var(--fs-s); }
#top .metar { font-family: var(--mono); font-size: var(--fs-s); color: var(--tx2); overflow: hidden; text-overflow: ellipsis; }
#top .val, #top .metar { font-variant-numeric: tabular-nums; }
#top .w-clock { width: calc(9.5ch * var(--ui) + 24px); }
#top .w-wind { width: calc(10ch * var(--ui) + 24px); }
#top .w-traffic { width: calc(20ch * var(--ui) + 24px); }
#top .w-score { width: calc(13ch * var(--ui) + 24px); }
#top .w-clock .val, #top .w-wind .val, #top .w-traffic .val, #top .w-score .val { overflow: hidden; text-overflow: ellipsis; }
#top .btns { flex-shrink: 0; flex-direction: row; align-items: center; gap: 4px; padding: 0 8px; }
.tb.wide { min-width: 8.5em; }
.tb { user-select: none; touch-action: manipulation; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 9px; font-size: var(--fs-s); color: var(--tx2); line-height: 1.2; }
.tb:hover { color: var(--tx); border-color: #3a4a5c; }
.tb.on { color: #04110c; background: var(--acc); border-color: var(--acc); font-weight: 600; }
.tb.warn { color: #1a0f00; background: var(--warn); border-color: var(--warn); }
#top select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; font-family: var(--mono); font-weight: 600; padding: 1px 4px; }
.score.neg { color: var(--alert); } .score.pos { color: var(--acc); }

/* ---------- side panels ---------- */
#side { display: grid; grid-template-rows: auto auto auto 1fr; min-height: 0; background: var(--bg2); }
.panel { border-bottom: 1px solid var(--line); min-height: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--tx3); background: #0d1218; border-bottom: 1px solid var(--line); }
.ph b { color: var(--tx2); font-weight: 600; }

// localStorage wrapped so the game still works when storage is blocked (file://, private mode, policies).
const mem = {};
function load(key, fallback) {
  try {
    const v = window.localStorage.getItem('atc.' + key);
    if (v != null) return JSON.parse(v);
  } catch (e) { if (key in mem) return mem[key]; }
  return key in mem ? mem[key] : fallback;
}
function save(key, value) {
  mem[key] = value;
  try { window.localStorage.setItem('atc.' + key, JSON.stringify(value)); return true; } catch (e) { return false; }
}

return { load, save };

    this.phase = s.phase || 'AIR'; // HOLDING_POINT | LINEUP | TAKEOFF | AIR | ROLLOUT | GONE
    this.route = s.route ? s.route.slice() : [];
    this.routeName = s.routeName || '';
    this.exitFix = s.exitFix || null;
    this.depRwy = s.depRwy || null;
    this.squawk = s.squawk;
    this.emergency = null; this.nordo = false; this.medical = !!s.medical; this.priority = !!s.medical || !!s.priority; this.special = !!s.special;
    this.clr = { alt: s.clrAlt ?? s.alt, spd: null, hdg: null, turnDir: null, landing: false, expect: null };
    this.nav = { mode: this.route.length ? 'ROUTE' : 'HDG', fix: null, hold: null, holdState: null, holdT: 0 };
    this.app = null;            // { rwy, end, state: ARMED | LOC | GS }
    this.queue = [];            // pending pilot actions { at, fn }
    this.controlled = s.kind !== 'DEP';
    this.handedOff = false; this.handoffAt = null;
    this.enteredAt = world.t; this.firstContact = false;
    this.trackMiles = 0; this.fuelBurn = 0;
    this.history = [];
    this.rbErr = null;
    this.goArounds = 0; this.landedAt = null;
    this.ident = 0;
    this.initialClimb = false;
    this.labelPos = s.labelPos ?? 1; this.labelCustom = null;
    this.strip = { state: s.kind === 'DEP' ? 'PENDING' : 'INBOUND', order: world.stripOrder++ };
    this.lastCmdAt = -999;
    this.stableChecked = false;
  }

  get ap() { return this.world.ap; }
  get airborne() { return this.phase === 'AIR'; }
  get onFinal() { return this.app && (this.app.state === 'LOC' || this.app.state === 'GS'); }
  tas(alt = this.alt, ias = this.ias) { return casToTas(ias, alt); }
  mach() { return casToMach(this.ias, this.alt); }
  // Speed envelope at this altitude: the lower of the IAS limit and the Mach limit.
  maxIas(alt = this.alt) { const p = this.perf; return p.mmo ? Math.min(p.vmax, machToCas(p.mmo, alt)) : p.vmax; }
  climbRate() { return lerp(this.perf.climb[0], this.perf.climb[1], clamp(this.alt / 24000, 0, 1)); }
  descRate() { return lerp(this.perf.desc[0], this.perf.desc[1], clamp(this.alt / 24000, 0, 1)); }
  maxTurnRate() { return Math.min(3, (1091 * Math.tan(this.perf.bank * DEG)) / Math.max(60, this.tas())); }

  // ---------- speed schedule ----------
  defaultSpeed() {
    const p = this.perf;
    if (this.app && this.app.state !== 'ARMED') {
      const d = this.distToThr();
      if (d < 4.5) return p.vapp;
      if (this.clr.spd) return this.clr.spd;
      if (d < 7) return Math.max(p.vapp, Math.min(160, p.vmax));
      return Math.min(180, Math.max(p.vapp + 20, Math.min(180, p.vmax)));
    }
    if (this.clr.mach) return machToCas(this.clr.mach, this.alt);
    if (this.clr.spd) return this.clr.spd;
    if (this.nav.mode === 'HOLD') return Math.min(this.alt < 14000 ? 230 : 240, p.vmax, Math.max(p.vmin + 10, p.vcruise));
    let v = this.alt < 10000 ? Math.min(250, p.vmax) : p.vcruise;
    if (this.kind === 'DEP' && this.alt < 10000) v = Math.min(250, Math.max(p.vclimb, p.vmin + 20));
    if (this.cls === 'GA') v = this.vs > 200 ? p.vclimb : p.vcruise;
    if (this.kind === 'ARR' && this.alt < 7000 && this.distToArp() < 25) v = Math.min(v, Math.max(p.vmin + 10, 220));
    return v;
  }

  distToArp() { return Math.hypot(this.x, this.y); }
  distToThr() { if (!this.app) return Infinity; const e = this.app.end; return -trackErrors(this.x, this.y, e.thrX, e.thrY, e.hdg).along; }
  gsAltAt(d) { const e = this.app.end; return this.ap.elev + 50 + Math.max(0, d) * FT_PER_NM * Math.tan(e.ils.gs * DEG); }

  // ---------- pilot interface ----------
  schedule(delay, fn) { this.queue.push({ at: this.world.t + delay, fn }); }

  // Apply a parsed, validated instruction list (called by the world after pilot delay).
  apply(cmds) {
    const ap = this.ap;
    for (const c of cmds) {
      switch (c.t) {
        case 'HDG':
          this.nav.mode = 'HDG'; this.clr.hdg = c.v; this.clr.turnDir = c.dir; this.nav.hold = null;
          if (this.app && this.app.state === 'ARMED' && this.app.viaIF) this.app.viaIF = false;
          if (c.cancelApp && this.app && this.app.state === 'ARMED') { this.app = null; this.nav.mode = 'HDG'; }
          break;
        case 'TURN':
          this.nav.mode = 'HDG'; this.clr.hdg = norm360(this.hdg + (c.dir === 'L' ? -c.deg : c.deg)); this.clr.turnDir = c.dir; break;
        case 'ALT': this.clr.alt = c.v; break;
        case 'SPD': this.clr.spd = c.v; this.clr.mach = null; break;
        case 'MACH': this.clr.mach = c.v; this.clr.spd = null; break;
        case 'SN': this.clr.spd = null; this.clr.mach = null; break;
        case 'DCT': {
          this.nav.mode = 'DCT'; this.nav.fix = c.fix; this.clr.hdg = null; this.nav.hold = null;
          const idx = this.route.indexOf(c.fix);
          if (idx >= 0) { this.route = this.route.slice(idx); this.nav.mode = 'ROUTE'; }
          break;
        }
        case 'HOLD': {
          const h = ap.holds[c.fix] || { inbound: norm360(bearing(this.x, this.y, ap.fixes[c.fix].x, ap.fixes[c.fix].y)), turn: 'R' };
          this.nav.mode = 'HOLD'; this.nav.hold = { fix: c.fix, inbound: h.inbound, turn: c.turn || h.turn }; this.nav.holdState = 'ENTRY';
          break;
        }
        case 'ILS': {
          const end = ap.ends[c.rwy];
          if (this.app && this.app.rwy === c.rwy && this.app.state !== 'ARMED') break; // repeated clearance: already established
          this.app = { rwy: c.rwy, end, state: 'ARMED', viaIF: this.nav.mode !== 'HDG' };
          this.clr.landing = false; this.clr.expect = c.rwy; this.stableChecked = false; this.minimaChecked = false;
          if (this.app.viaIF && end.if) { this.nav.mode = 'DCT'; this.nav.fix = end.if.name; }
          break;
        }
        case 'EXP': this.clr.expect = c.rwy; break;
        case 'CL': this.clr.landing = true; break;
        case 'GA': this.goAround('instructed'); break;
        case 'RES':
          if (this.route.length) { this.nav.mode = 'ROUTE'; this.clr.hdg = null; }
          break;
        case 'SQK': this.squawk = c.code; break;
        case 'ID': this.ident = 18; break;
        default: break;
      }
    }
  }

  goAround(reason) {
    if (this.phase !== 'AIR' || !this.app) return;
    if (this.perf.glider) { // no engine: it lands regardless
      if (!this.gliderWarned) { this.gliderWarned = true; this.world.onEvent(this, 'GLIDER', reason); }
      this.clr.landing = true; this.stableChecked = true; this.minimaChecked = true;
      return;
    }
    const end = this.app.end;
    this.world.onGoAround(this, reason);
    this.app = null; this.clr.landing = false; this.goArounds++; this.missedAt = this.world.t;
    this.nav.mode = 'HDG'; this.clr.hdg = end.hdg; this.clr.turnDir = null;
    this.clr.alt = Math.max(this.ap.ta >= 5000 ? 3000 : 2500, Math.ceil((this.ap.elev + 2500) / 500) * 500);
    this.clr.spd = Math.min(this.perf.vmax, Math.max(this.perf.vmin, 190));
    this.gaUntil = this.world.t + 40;
  }

  // ---------- fixed-step physics ----------
  step(dt) {
    const w = this.world;
    for (let i = this.queue.length - 1; i >= 0; i--) if (this.queue[i].at <= w.t) { const q = this.queue.splice(i, 1)[0]; q.fn(); }
    this.px = this.x; this.py = this.y; this.palt = this.alt; this.phdg = this.hdg;
    if (this.ident > 0) this.ident -= dt;
    switch (this.phase) {
      case 'HOLDING_POINT': case 'LINEUP': return;
      case 'TAKEOFF': return this.stepTakeoff(dt);
      case 'ROLLOUT': return this.stepRollout(dt);
      case 'GONE': return;
      default: break;
    }
    const desired = this.lateral(dt);
    this.turn(desired, dt);
    this.vertical(dt);
    this.speed(dt);
    this.move(dt);
    if (this.app) this.approachChecks();
  }

  turn(desired, dt) {
    if (desired == null) { this.turnRate += clamp(-this.turnRate, -ROLL_ACCEL * dt, ROLL_ACCEL * dt); this.hdg = norm360(this.hdg + this.turnRate * dt); return; }
    let diff = angleDiff(this.hdg, desired);
    const td = this.clr.turnDir;
    if (td && this.nav.mode === 'HDG') {
      if (Math.abs(diff) < 3) this.clr.turnDir = null;
      else if (td === 'L' && diff > 0) diff -= 360;
      else if (td === 'R' && diff < 0) diff += 360;
    }
    const maxR = this.maxTurnRate();
    const target = clamp(diff * 0.55, -maxR, maxR);
    this.turnRate += clamp(target - this.turnRate, -ROLL_ACCEL * dt, ROLL_ACCEL * dt);
    this.hdg = norm360(this.hdg + this.turnRate * dt);
  }

  // Heading that makes good a desired ground track, given wind at current altitude.
  wca(track) {
    const wd = this.world.weather.windAt(this.alt, this.ap.elev);
    const r = [Math.cos(track * DEG), -Math.sin(track * DEG)];
    const cross = wd.vx * r[0] + wd.vy * r[1];
    const v = this.tas();
    return norm360(track - Math.asin(clamp(cross / v, -0.9, 0.9)) / DEG);
  }

  turnRadius() { return (this.tas() / 3600) / (this.maxTurnRate() * DEG); }

  steerToFix(fx, fy) { return this.wca(bearing(this.x, this.y, fx, fy)); }

  lateral(dt) {
    const ap = this.ap;
    // ILS localiser capture/track overrides lateral modes once captured
    if (this.app) {
      const e = this.app.end;
      const te = trackErrors(this.x, this.y, e.thrX, e.thrY, e.hdg);
      if (this.app.state === 'ARMED' && !this.app.viaIF) {
        const trackDiff = Math.abs(angleDiff(this.track, e.hdg));
        const lead = this.turnRadius() * (1 - Math.cos(Math.min(trackDiff, 90) * DEG)) + 0.15;
        const ahead = te.along < -0.5 && -te.along < e.ils.locRange;
        const inCone = Math.abs(te.cross) < Math.tan(35 * DEG) * -te.along + 0.5;
        const converging = trackDiff < 100 && (Math.sign(te.cross) !== Math.sign(angleDiff(e.hdg, this.track)) || Math.abs(te.cross) < 0.3);
        if (ahead && inCone && converging && Math.abs(te.cross) <= lead) { this.app.state = 'LOC'; this.nav.mode = 'APP'; this.world.onEvent(this, 'LOC'); }
      }
      if (this.app.state === 'LOC' || this.app.state === 'GS') {
        const corr = clamp(-te.cross * 45, -30, 30);
        return this.wca(norm360(e.hdg + corr));
      }
    }
    const m = this.nav.mode;
    if (m === 'HDG') return this.clr.hdg ?? this.hdg;
    if (m === 'DCT') {
      const f = ap.fixes[this.nav.fix];
      if (!f) { this.nav.mode = 'HDG'; return this.hdg; }
      const d = dist(this.x, this.y, f.x, f.y);
      if (d < 0.6) {
        // over the fix
        if (this.app && this.app.state === 'ARMED' && this.app.viaIF && this.app.end.if && f.name === this.app.end.if.name) {
          // flying the published procedure: over the IF the aircraft is on the localiser by definition
          this.app.viaIF = false; this.app.state = 'LOC'; this.nav.mode = 'APP'; this.clr.hdg = this.app.end.hdg; this.clr.turnDir = null;
          this.world.onEvent(this, 'LOC');
          return this.lateral(dt);
        }
        const idx = this.route.indexOf(f.name);
        if (idx >= 0 && idx < this.route.length - 1) { this.route = this.route.slice(idx + 1); this.nav.mode = 'ROUTE'; return this.lateral(dt); }
        if (this.kind === 'ARR' && this.ap.holds[f.name]) { this.apply([{ t: 'HOLD', fix: f.name }]); return this.hdg; }
        this.nav.mode = 'HDG'; this.clr.hdg = this.hdg; return this.hdg;
      }
      return this.steerToFix(f.x, f.y);
    }
    if (m === 'ROUTE') {
      if (this.initialClimb) {
        if (this.alt - ap.elev < 1100) return this.depHdg ?? this.hdg;
        this.initialClimb = false;
      }
      if (!this.route.length) {
        if (this.kind === 'ARR') return this.hdg;
        return this.hdg;
      }
      const f = ap.fixes[this.route[0]];
      const d = dist(this.x, this.y, f.x, f.y);
      let lead = 0.5;
      if (this.route.length > 1) {
        const nf = ap.fixes[this.route[1]];
        const delta = Math.abs(angleDiff(bearing(this.x, this.y, f.x, f.y), bearing(f.x, f.y, nf.x, nf.y)));
        lead = clamp(this.turnRadius() * Math.tan(Math.min(delta, 120) * DEG / 2), 0.4, 4);
      }
      if (d < lead) {
        const passed = this.route.shift();
        this.world.onFixPassed(this, passed);
        if (!this.route.length) {
          if (this.kind === 'ARR' && this.ap.holds[passed] && !(this.app && this.app.state !== 'ARMED')) {
            if (this.nordo || this.world.auto('autoApproach')) this.autoApproach();
            else this.apply([{ t: 'HOLD', fix: passed }]);
          } else { this.nav.mode = 'HDG'; this.clr.hdg = this.hdg; }
          return this.hdg;
        }
        return this.lateral(dt);
      }
      return this.steerToFix(f.x, f.y);
    }
    if (m === 'HOLD') return this.holdGuidance(dt);
    return this.hdg;
  }

  autoApproach() {
    const rwy = this.world.runwayConfig.arr;
    this.apply([{ t: 'ILS', rwy }]);
    if (this.clr.alt > (this.ap.ends[rwy].if?.alt || 4000)) this.clr.alt = this.ap.ends[rwy].if?.alt || 4000;
    if (this.nordo) this.clr.landing = true;
  }

  holdGuidance(dt) {
    const h = this.nav.hold, f = this.ap.fixes[h.fix];
    const out = norm360(h.inbound + 180);
    const legTime = this.alt > 14000 ? 90 : 60;
    switch (this.nav.holdState) {
      case 'ENTRY':
        if (dist(this.x, this.y, f.x, f.y) < 0.7) { this.nav.holdState = 'OUTBOUND_TURN'; this.clr.turnDir = h.turn; this.holdTurnDir = h.turn; }
        return this.steerToFix(f.x, f.y);
      case 'OUTBOUND_TURN': {
        const remaining = h.turn === 'R' ? norm360(out - this.hdg) : norm360(this.hdg - out);
        if (remaining < 5 || remaining > 355) { this.nav.holdState = 'OUTBOUND'; this.nav.holdT = 0; }
        return norm360(this.hdg + (h.turn === 'R' ? 1 : -1) * Math.min(remaining, 60));
      }
      case 'OUTBOUND':
        this.nav.holdT += dt;
        if (this.nav.holdT > legTime) this.nav.holdState = 'INBOUND_TURN';
        return this.wca(out);
      case 'INBOUND_TURN': {
        const brg = bearing(this.x, this.y, f.x, f.y);
        const d = angleDiff(this.hdg, brg);
        if (Math.abs(d) < 20) this.nav.holdState = 'INBOUND';
        return norm360(this.hdg + (h.turn === 'R' ? 1 : -1) * 60);
      }
      case 'INBOUND': {
        const te = trackErrors(this.x, this.y, f.x, f.y, h.inbound);
        if (te.along > -0.3) { this.nav.holdState = 'OUTBOUND_TURN'; this.world.onEvent(this, 'HOLDLAP'); }
        return this.wca(norm360(h.inbound + clamp(-te.cross * 40, -40, 40)));
      }
      default: return this.hdg;
    }
  }

  vertical(dt) {
    let target = this.clr.alt;
    let vsTarget;
    if (this.app && (this.app.state === 'LOC' || this.app.state === 'GS')) {
      const d = this.distToThr();
      const gsAlt = this.gsAltAt(d);
      // established on the localiser: descend to the published FAF altitude so the glideslope is met from below
      const faf = this.app.end.faf;
      if (this.app.state === 'LOC' && faf && target != null && target > faf.alt && this.alt > gsAlt - 60) target = faf.alt;
      if (this.app.state === 'LOC' && this.alt >= gsAlt - 60 && this.alt <= gsAlt + (this.vs < -300 ? 300 : 150) && d < 20) { this.app.state = 'GS'; this.world.onEvent(this, 'GS'); }
      if (this.app.state === 'GS') {
        const nominal = -Math.tan(this.app.end.ils.gs * DEG) * FT_PER_NM * this.gs / 60;
        vsTarget = clamp(nominal + (gsAlt - this.alt) * 2.5, -2500, 800);
        target = null;
      }
    }
    if (target != null) {
      const dAlt = target - this.alt;
      vsTarget = clamp(dAlt * 4, -this.descRate(), this.climbRate());
      if (this.gaUntil && this.world.t < this.gaUntil) vsTarget = Math.max(vsTarget, Math.min(this.climbRate(), dAlt * 4));
      if (Math.abs(dAlt) < 8 && Math.abs(this.vs) < 120) { this.alt = target; this.vs = 0; return; }
    }
    this.vs += clamp(vsTarget - this.vs, -VS_ACCEL * dt, VS_ACCEL * dt);
    this.alt += (this.vs / 60) * dt;
    if (this.alt < this.ap.elev) this.alt = this.ap.elev;
  }

  speed(dt) {
    const p = this.perf;
    let target = this.defaultSpeed();
    if (this.alt < 10000 && !this.clr.spd && !this.clr.mach && this.kind !== 'OVR' && !this.special) target = Math.min(target, 250);
    target = clamp(target, this.app && this.app.state !== 'ARMED' ? p.vapp : Math.min(p.vmin, target), this.maxIas());
    // Established on final: ATC speed control ends around 4 nm, crew configures and flies Vapp.
    const fin = this.app && (this.app.state === 'GS' || this.app.state === 'LOC') ? this.distToThr() : null;
    if (fin != null && fin < 7) target = fin < 4.5 ? p.vapp : Math.min(target, Math.max(160, p.vapp + 5));
    let acc = p.accel, dec = p.decel;
    if (this.vs > 300) acc *= 0.6;
    if (this.vs < -300 && fin == null) dec *= 0.55;
    this.ias += clamp(target - this.ias, -dec * dt, acc * dt);
  }

  move(dt) {
    const w = this.world.weather.windAt(this.alt, this.ap.elev);
    const v = this.tas();
    const [hx, hy] = hdgVec(this.hdg);
    this.vx = hx * v + w.vx; this.vy = hy * v + w.vy;
    this.gs = Math.hypot(this.vx, this.vy);
    this.track = norm360(Math.atan2(this.vx, this.vy) / DEG);
    const dx = (this.vx / 3600) * dt, dy = (this.vy / 3600) * dt;
    this.x += dx; this.y += dy;
    if (this.controlled) this.trackMiles += Math.hypot(dx, dy);
    this.fuelBurn += dt * fuelRate(this.cls, this.alt);
  }

  approachChecks() {
    const w = this.world, s = w.settings;
    const d = this.distToThr();
    const e = this.app.end;
    if (this.app.state === 'ARMED') {
      if (this.app.viaIF) return;
      // flew through the localiser without capture
      const te = trackErrors(this.x, this.y, e.thrX, e.thrY, e.hdg);
      if (te.along > -1) { this.app = null; w.onEvent(this, 'LOCMISS'); }
      return;
    }
    if (e.runway.closed && d < 6) return this.goAround('runway closed');
    if (this.app.state !== 'GS' && d < 3) return this.goAround(this.alt > this.gsAltAt(d) ? 'too high, glideslope not captured' : 'not established on the glideslope');
    // stability gate at 1000 ft AAL
    const aal = this.alt - this.ap.elev;
    if (!this.stableChecked && aal < 1000 && d < 4) {
      this.stableChecked = true;
      const gsDev = this.alt - this.gsAltAt(d);
      if (this.app.state !== 'GS' || Math.abs(gsDev) > 300) return this.goAround('unstable, not on glidepath');
      if (this.ias > this.perf.vapp + 30) return this.goAround('unstable, too fast');
    }
    if (this.app.state === 'GS' && d < 2 && !this.clr.landing && w.auto('autoLandClearance')) {
      if (!w.runwayOccupied(e.runway, this)) { this.clr.landing = true; w.onEvent(this, 'AUTOCL'); }
    }
    if (d < 1.0 && !this.clr.landing) return this.goAround('no landing clearance');
    if (d < 0.9 && w.runwayOccupied(e.runway, this)) return this.goAround('runway occupied');
    if (d < 0.5 && !this.minimaChecked) {
      this.minimaChecked = true;
      const wx = w.weather;
      if ((wx.cloud < e.ils.dh || wx.vis < 550) && w.rng.chance(0.7)) return this.goAround('weather below minima');
      const ht = wx.headTail(e.hdg);
      if (ht.head < -10 || ht.cross > 35) return this.goAround('wind out of limits');
    }
    if (d <= 0.05 && this.alt <= this.ap.elev + 60) {
      this.phase = 'ROLLOUT'; this.alt = this.ap.elev; this.vs = 0; this.rollT = 0; this.hdg = e.hdg;
      w.onTouchdown(this);
    }
  }

  stepTakeoff(dt) {
    const p = this.perf;
    this.ias = Math.min(p.vr + 15, this.ias + (this.cls === 'GA' ? 2.5 : this.cls === 'WB' ? 3.0 : 3.6) * dt);
    const w = this.world.weather.windAt(this.ap.elev, this.ap.elev);
    const [hx, hy] = hdgVec(this.hdg);
    const v = this.ias;
    this.vx = hx * v + w.vx * 0.2; this.vy = hy * v + w.vy * 0.2;
    this.x += (this.vx / 3600) * dt; this.y += (this.vy / 3600) * dt;
    this.gs = Math.hypot(this.vx, this.vy); this.track = this.hdg;
    if (this.ias >= p.vr) {
      this.phase = 'AIR'; this.vs = Math.min(1500, this.climbRate()); this.alt = this.ap.elev + 20;
      this.initialClimb = true; this.depHdg = this.hdg; this.nav.mode = 'ROUTE';
      this.world.onAirborne(this);
    }
  }

  stepRollout(dt) {
    this.rollT += dt;
    this.ias = Math.max(15, this.ias - 3 * dt);
    const [hx, hy] = hdgVec(this.hdg);
    this.vx = hx * this.ias; this.vy = hy * this.ias; this.gs = this.ias;
    this.x += (this.vx / 3600) * dt; this.y += (this.vy / 3600) * dt;

      if (c.t === 'ALT') { take('vert', ac.kind === 'ARR' ? 'descent' : ac.kind === 'DEP' ? 'climb' : 'separation', 'level'); o.by.vert = 'user'; }
      if (['SPD', 'MACH', 'SN'].includes(c.t) && ac.kind === 'ARR') take('spd', 'approach', 'speed');
      if (c.t === 'CL') o.by.cl = 'user';
      if (c.t === 'HO') o.by.ho = 'user';
      if (c.t === 'REL' && ac.strip.state === 'PENDING') {
        o.by.rel = 'user';
        if (this.user('release') && !o.fails.release) this.record('release', w.t - (o.contactAt ?? ac.enteredAt) < 150, ac);
      }
    }
  }

  // ---------- outcomes ----------
  record(task, ok, ac, note) {
    if (!this.user(task)) return;
    const tr = this.training;
    const h = tr.hist[task] || (tr.hist[task] = []);
    h.push(ok ? 1 : 0); if (h.length > HIST) h.shift();
    tr.outcomes = (tr.outcomes || 0) + 1;
    if (!ok && note) this.say(note, 'warn', true, ac ? { ac: ac.id } : {});
    this.w.bus?.emit('training', this);
    this.review();
  }
  failOnce(task, ac, note) { const o = this.st(ac); if (o.fails[task]) return; o.fails[task] = true; this.record(task, false, ac, note); }

  onHandoffRejected(ac, reason) {
    const o = this.st(ac);
    if (o.by.ho !== 'user') return;
    o.by.ho = null;
    if (/climb/.test(reason)) this.failOnce('climb', ac, `${ac.callsign} was too low for the next sector (${reason}). Climb departures before handing off.`);
    this.record('handoff', false, ac, `Handoff of ${ac.callsign} rejected: ${reason}. Hand off near the exit fix, high enough, and clear of conflicts.`);
  }
  onHandoff(ac, late) {
    const o = this.st(ac), ap = this.w.ap;
    if (late) this.record('handoff', false, ac, `${ac.callsign} left the sector without a handoff. Watch for traffic nearing the edge and use HO.`);
    else if (o.by.ho === 'user') this.record('handoff', true, ac);
    if (ac.kind === 'DEP' && !o.fails.climb) {
      const owner = ap.exitOwner[ac.exitFix] || ap.adjacent[0];
      const ok = ac.alt >= owner.minAlt - 1000 || ac.clr.alt >= owner.minAlt;
      this.record('climb', ok, ac, ok ? null : `${ac.callsign} wasn't high enough for ${owner.name}. Climb departures to at least ${fmtAlt(owner.minAlt, ap.ta)}.`);
    }
  }
  onEvent(ac, kind) {
    const o = this.st(ac);
    if (kind === 'LOC' && ac.kind === 'ARR') { if (!o.locOk && !o.fails.approach) { o.locOk = true; this.record('approach', true, ac); } }
    if (kind === 'LOCMISS') {
      o.stage = 'DW'; o.side = 0;
      this.failOnce('approach', ac, `${ac.callsign} flew through the localiser. Turn it onto a 30° intercept about 2 nm before the centreline, then clear the ILS.`);
    }
  }
  onGoAround(ac, reason) {
    const o = this.st(ac);
    o.stage = 'DW'; o.side = 0; o.locOk = false;
    if (/no landing clearance/.test(reason)) this.failOnce('landing', ac, `${ac.callsign} went around with no landing clearance. Give CL once it's established, by 4 nm.`);
    else if (/too high/.test(reason)) this.failOnce('descent', ac, `${ac.callsign} was too high to capture the glideslope. Start descents earlier: about 3 nm per 1000 ft.`);
    else if (/not established|unstable/.test(reason)) this.failOnce('approach', ac, `${ac.callsign} went around (${reason}). Intercept 10+ nm out, below the glideslope, at about 180 kt.`);
  }
  onTouchdown(ac) {
    const o = this.st(ac);
    if (o.by.cl === 'user') this.record('landing', true, ac);
    if (!o.fails.descent) this.record('descent', true, ac);
  }
  onIncident(inc) {
    const w = this.w, acs = inc.ids.map(id => w.find(id)).filter(Boolean);
    if (inc.type === 'LOS') {
      for (const r of this.stca.values()) if (inc.ids.every(id => r.ids.includes(id))) r.los = true;
      if (acs[0]) this.failOnce('separation', acs[0], `Loss of separation, ${acs.map(a => a.callsign).join(' / ')}. When STCA flashes, stop the climb or descent 1000 ft apart or turn one away.`);
    }
    if (inc.type === 'MSAW' && acs[0]) {
      const a = acs[0];
      this.failOnce(a.kind === 'DEP' ? 'climb' : 'descent', a, `${a.callsign} went below the minimum vectoring altitude. Check the MVA sector before descending.`);
    }
    if (inc.type === 'WAKE' && acs[0]) this.failOnce('approach', acs[0], `${acs[0].callsign} is too close behind ${acs[1]?.callsign || 'the aircraft ahead'} for wake turbulence. Turn base later behind heavier traffic.`);
  }

  // ---------- training progression ----------
  review() {
    if (this.mode !== 'training' || this.offer) return;
    const tr = this.training, n = tr.outcomes || 0;
    for (const t of TASKS) {   // struggling: offer to take a task back
      if (!tr.owned[t.id]) continue;
      const h = (tr.hist[t.id] || []).slice(-4);
      if (h.length >= 4 && h.filter(x => !x).length >= 3 && n >= (tr.snooze['back:' + t.id] || 0)) {
        this.offer = { kind: 'back', task: t.id };
        this.say(`${t.name} are tricky. Want me to take them back for a while? (see the training panel)`, 'warn', true);
        this.w.bus?.emit('trainOffer', this.offer); return;
      }
    }
    const next = TASKS.find(t => !tr.owned[t.id]);
    if (!next || n < (tr.snooze[next.id] || 0)) return;
    const owned = TASKS.filter(t => tr.owned[t.id]);
    const ready = owned.every(t => { const h = (tr.hist[t.id] || []).slice(-6); return h.length >= 5 && h.reduce((a, b) => a + b, 0) >= h.length - 1; });
    if (!ready) return;
    this.offer = { kind: 'next', task: next.id };
    this.say(`Nicely done — you're handling ${owned.map(t => t.name.toLowerCase()).join(', ')} well. Ready to take ${next.name.toLowerCase()} too? (see the training panel)`, 'info', true);
    this.w.bus?.emit('trainOffer', this.offer);
  }
  answer(yes) {
    const of = this.offer; if (!of) return;
    const tr = this.training, n = tr.outcomes || 0;
    if (of.kind === 'next') { if (yes) this.setOwner(of.task, 'user'); else { tr.snooze[of.task] = n + 5; this.say('No problem. I\'ll ask again in a little while.'); } }
    else if (yes) { tr.hist[of.task] = []; this.setOwner(of.task, 'ojti', 'not a problem'); }
    else { tr.snooze['back:' + of.task] = n + 6; tr.hist[of.task] = (tr.hist[of.task] || []).slice(-2); this.say('OK, keep at it. You\'ve got this.'); }
    this.offer = null;
    this.w.bus?.emit('training', this);
  }

  // ---------- main loop ----------
  step(dt) {
    this.thinkT += dt;
    if (this.thinkT < 1 - 1e-9) return;
    this.thinkT = 0;
    this.trackStca();
    const w = this.w;
    for (const ac of w.aircraft) {
      if (ac.phase === 'GONE' || ac.handedOff) continue;
      const o = this.st(ac);
      if (ac.firstContact && o.contactAt == null) o.contactAt = w.t;
      if (ac.kind === 'DEP' && ac.phase === 'HOLDING_POINT') this.doRelease(ac);
      if (ac.phase !== 'AIR' || (!ac.firstContact && ac.kind !== 'DEP')) continue;
      if (ac.kind !== 'ARR') this.doHandoff(ac);
      if (ac.kind === 'DEP') this.doClimb(ac);
      if (ac.kind === 'ARR') { this.doLanding(ac); this.doDescent(ac); }
      this.doResume(ac);
    }
    this.doApproach();
    this.doSeparation();
  }

  // ---------- release ----------
  doRelease(ac) {
    const w = this.w, o = this.st(ac);
    if (ac.strip.state !== 'PENDING' || o.contactAt == null) return;
    const waited = w.t - o.contactAt;
    if (this.ojti('release')) { if (waited > 8 && this.free(ac)) this.issue(ac, [{ t: 'REL' }]); return; }
    if (waited > 40) this.hint(ac, 'rel', [{ t: 'REL' }], 'it is waiting at the holding point for release', 90);
    if (waited > 150) this.failOnce('release', ac, `${ac.callsign} has been waiting over two minutes for release. Release departures with REL.`);
  }

  // ---------- handoff ----------
  handoffReady(ac) {
    const ap = this.w.ap;
    const exit = ap.fixes[ac.exitFix], owner = ap.exitOwner[ac.exitFix] || ap.adjacent[0];
    const r = Math.hypot(ac.x, ac.y);
    const outbound = ac.x * ac.vx + ac.y * ac.vy > 0;
    const near = (exit && dist(ac.x, ac.y, exit.x, exit.y) <= 24) || r > ap.sectorRadius - 12;
    if (!near || !outbound) return false;
    if (ac.kind === 'DEP' && (ac.clr.alt < owner.minAlt || ac.alt < owner.minAlt - 2500)) return false;
    return !this.w.alerts.some(a => (a.type === 'STCA' || a.type === 'LOS') && a.ids.includes(ac.id));
  }
  doHandoff(ac) {
    if (!ac.controlled || !this.handoffReady(ac)) { this.st(ac).due.ho = null; return; }
    const o = this.st(ac);
    if (this.ojti('handoff')) { if (this.free(ac) && this.w.t - (o.hoAt ?? -99) > 30) { o.hoAt = this.w.t; this.issue(ac, [{ t: 'HO' }]); } return; }
    o.due.ho ??= this.w.t;
    if (this.w.t - o.due.ho > 15) this.hint(ac, 'ho', [{ t: 'HO' }], `it is near ${ac.exitFix || 'the boundary'} and clear of traffic, hand it on`);
  }
  // after a separation turn, put departures and overflights back on their route
  doResume(ac) {
    const o = this.st(ac);
    if (o.manual.lat || ac.nav.mode !== 'HDG' || !o.sepTurn || this.w.t < o.latHold || !this.free(ac)) return;
    if (!this.ojti('separation') || (ac.kind === 'ARR' && this.committed(ac))) return; // the approach plan owns those
    if (this.w.alerts.some(a => a.type === 'STCA' && a.ids.includes(ac.id))) return;
    if (ac.kind === 'ARR' && this.w.aircraft.some(b => b !== ac && b.phase === 'AIR' && Math.abs(b.alt - ac.alt) < 1000 && dist(ac.x, ac.y, b.x, b.y) < 10)) return;
    o.sepTurn = false;
    if (ac.route.length) this.issue(ac, [{ t: 'DCT', fix: ac.route[0] }]);
    else if (ac.kind === 'ARR') this.toHold(ac);
  }

  // ---------- landing ----------
  doLanding(ac) {
    if (!ac.onFinal || ac.nordo) return;
    if (ac.clr.landing && !(this.ojti('landing') && ac.distToThr() < 2.7 && ac.distToThr() > 1.2 && this.w.runwayOccupied(ac.app.end.runway, ac))) return;
    const w = this.w, d = ac.distToThr();
    if (d > 6) return;
    if (this.ojti('landing') && d < 2.7 && d > 1.2 && w.runwayOccupied(ac.app.end.runway, ac) && this.free(ac)) { this.issue(ac, [{ t: 'GA' }]); return; }
    const free = !w.runwayOccupied(ac.app.end.runway, ac);
    if (this.ojti('landing')) { if (free && this.free(ac)) this.issue(ac, [{ t: 'CL' }]); return; }
    if (free && d < 5) this.hint(ac, 'cl', [{ t: 'CL' }], `established on final, ${d.toFixed(1)} nm, runway ${ac.app.rwy} is free`, 30);
  }

  // ---------- terrain / probes ----------
  minSafe(x, y, alt) {
    const ap = this.w.ap;
    let m = mvaAt(ap, x, y);
    for (const r of ap.restricted) if (r.active && r.floor <= alt + 1000 && pointInPoly(x, y, r.poly)) m = Math.max(m, r.ceil + 500);
    return m;
  }
  minSafeAhead(ac, alt = ac.alt, nm = 6) {
    const [ux, uy] = hdgVec(ac.track), f = ac.app ? this.frame() : null;
    let m = 0;
    for (let d = 0; d <= nm; d += 1) {
      const px = ac.x + ux * d, py = ac.y + uy * d;
      if (f && d > 0) { const L = this.local(f, px, py); if (L.a > 0 && Math.abs(L.s) < 1) break; } // on the protected final beyond here
      m = Math.max(m, this.minSafe(px, py, alt));
    }
    if (Math.hypot(ac.x, ac.y) < 3) m = Math.min(m, this.w.ap.elev + 1500);
    return ceil100(m);
  }
  // Is clearing ac to `level` clear of every other aircraft for the next ~150 s (straight-line prediction)?
  probe(ac, level, horizon = 150) {
    const w = this.w, ap = w.ap;
    const lat = w.settings.sepLateral + 1.8, vert = w.settings.sepVertical - 50;
    const rate = (level > ac.alt ? ac.climbRate() : ac.descRate()) / 60;
    for (const o of w.aircraft) {
      if (o === ac || o.phase !== 'AIR' || o.alt - ap.elev < 300) continue;
      if (dist(ac.x, ac.y, o.x, o.y) > 35) continue;
      const orate = Math.max(Math.abs(o.vs), 500) / 60;
      for (let t = 0; t <= horizon; t += 10) {
        const ah = ac.nav.mode === 'HOLD', oh = o.nav.mode === 'HOLD';
        const ax = ah ? ac.x : ac.x + ac.vx / 3600 * t, ay = ah ? ac.y : ac.y + ac.vy / 3600 * t;
        const bx = oh ? o.x : o.x + o.vx / 3600 * t, by = oh ? o.y : o.y + o.vy / 3600 * t;
        if (Math.hypot(ax - bx, ay - by) >= lat + (ah ? 4 : 0) + (oh ? 4 : 0)) continue;
        const aAlt = ac.alt + clamp(level - ac.alt, -rate * t, rate * t);
        const oAlt = o.onFinal ? Math.max(ap.elev, o.alt + o.vs / 60 * t) : o.alt + clamp(o.clr.alt - o.alt, -orate * t, orate * t);
        if (Math.abs(aAlt - oAlt) < vert) return false;
      }
    }
    return true;
  }
  // Lowest/highest probe-clear level between from and to (inclusive of `to`), stepping in 1000s. null if none.
  bestLevel(ac, from, to) {
    const down = to < from;
    const list = [to];
    for (let L = down ? ceil1000(to + 1) : floor1000(to - 1); down ? L < from - 50 : L > from + 50; L += down ? 1000 : -1000) list.push(L);
    for (const L of list) if ((down ? L < from - 50 : L > from + 50) && this.probe(ac, L)) return L;
    return null;
  }

  // ---------- climbs ----------
  climbTarget(ac) {
    const ap = this.w.ap, owner = ap.exitOwner[ac.exitFix] || ap.adjacent[0];
    return Math.min(ac.perf.ceiling, ap.ceiling - 500, Math.max(owner.minAlt, Math.min(ac.rfl || 0, owner.minAlt + 2000)));
  }
  doClimb(ac) {
    const w = this.w, o = this.st(ac);
    if (!ac.controlled || ac.alt - w.ap.elev < 600 || o.manual.vert) return;
    const target = this.climbTarget(ac);
    if (this.user('climb')) {
      if (ac.clr.alt < target && Math.abs(ac.alt - ac.clr.alt) < 400) {
        o.due.climb ??= w.t;
        const L = this.bestLevel(ac, ac.clr.alt, target);
        if (L && w.t - o.due.climb > 20) this.hint(ac, 'climb', [{ t: 'ALT', v: L }], `climb it towards ${fmtAlt(target, w.ap.ta)} for the next sector`, 60);
      } else o.due.climb = null;
      return;
    }
    if (!this.free(ac) || w.t < o.sepUntil || w.t - o.vertAt < 6) return;
    // stop a climb that is about to conflict
    if (ac.clr.alt > ac.alt + 400 && !this.probe(ac, ac.clr.alt)) {
      const L = this.bestLevel(ac, ac.clr.alt, ceil1000(ac.alt + 300));
      if (L && L < ac.clr.alt) { this.issue(ac, [{ t: 'ALT', v: L }]); return; }
    }
    if (ac.clr.alt < target) { const L = this.bestLevel(ac, ac.clr.alt, target); if (L) this.issue(ac, [{ t: 'ALT', v: L }]); }
  }

  // ---------- arrival geometry ----------
  frame() {
    const w = this.w, end = w.ap.ends[w.runwayConfig.arr];
    if (!end || !end.ils) return null;
    const c = end.hdg;
    const f = { end, c, ox: hdgVec(c + 180), nx: hdgVec(c + 90), tx: end.thrX, ty: end.thrY };
    f.ifAlt = end.if?.alt || 4000; f.fafAlt = end.faf?.alt || 2000;
    f.ifPt = end.if || { x: end.thrX + f.ox[0] * 12, y: end.thrY + f.ox[1] * 12 };
    f.ifDist = dist(f.ifPt.x, f.ifPt.y, f.tx, f.ty);
    f.ok = end.ils.status === 'OK' && !end.runway.closed;
    return f;
  }
  local(f, x, y) { const dx = x - f.tx, dy = y - f.ty; return { a: dx * f.ox[0] + dy * f.ox[1], s: dx * f.nx[0] + dy * f.nx[1] }; }
  toWorld(f, a, s) { return [f.tx + f.ox[0] * a + f.nx[0] * s, f.ty + f.ox[1] * a + f.nx[1] * s]; }
  gsAlt(f, a) { return this.w.ap.elev + 50 + Math.max(0, a) * FT_PER_NM * Math.tan(f.end.ils.gs * DEG); }

  // Track miles to touchdown, and whether the remaining path can still be stretched (downwind) or not.
  tm(ac, f) {
    if (ac.onFinal) return { tm: ac.distToThr(), flex: false };
    const L = this.local(f, ac.x, ac.y), st = this.st(ac).stage;
    if ((ac.app && ac.app.viaIF) || (!ac.app && st === 'DIRECT')) return { tm: dist(ac.x, ac.y, f.ifPt.x, f.ifPt.y) + f.ifDist, flex: false };
    if (ac.app || st === 'INT') return { tm: Math.max(0, L.a) + 0.27 * Math.abs(L.s), flex: false };
    if (st === 'BASE') return { tm: Math.max(0, L.a) + Math.abs(L.s) + 0.5, flex: false };
    const aB = Math.max(BASE_MIN, L.a);
    return { tm: (aB - L.a) + Math.abs(L.s) + aB + 0.5, flex: true };
  }
  // Minimum spacing at the threshold: radar separation, wake category, and time for the leader to vacate the runway
  // before the follower is on short final.
  minSp(lead, fol) { return Math.max(this.w.settings.sepLateral, WAKE_NM[lead.wake]?.[fol.wake] || 0, 2.6 + lead.perf.roll * fol.perf.vapp / 3600); }
  // Spacing a faster follower loses while the leader flies its remaining `leadTm` track miles at approach speed.
  comp(lead, fol, leadTm) { return Math.min(leadTm, 12) * Math.max(0, (fol.perf.vapp + 15) / (lead.perf.vapp + 5) - 1); }
  gap(lead, fol, leadTm = 0) { return this.minSp(lead, fol) + SPACING_BUFFER + this.comp(lead, fol, leadTm); }
  committed(ac) {
    if (ac.kind !== 'ARR' || ac.phase !== 'AIR' || !ac.firstContact) return false;
    const o = this.st(ac);
    return !!ac.app || ['DW', 'BASE', 'INT', 'DIRECT'].includes(o.stage) || ((o.manual.lat || this.user('approach')) && ac.nav.mode === 'HDG');
  }
  // Would putting `ac` into the flow with track miles `tm` (not stretchable) keep spacing with everyone who can't stretch?
  slotClear(ac, tm, others) {
    for (const x of others) {
      if (x.ac === ac || x.flex) continue;
      const need = x.tm <= tm ? this.gap(x.ac, ac, x.tm) : this.gap(ac, x.ac, tm);
      if (Math.abs(x.tm - tm) < need) return false;
    }
    return true;
  }

  // ---------- vectors, sequencing & ILS ----------
  doApproach() {
    const w = this.w, f = this.frame();
    if (!f) return;
    const arr = w.aircraft.filter(a => a.kind === 'ARR' && a.phase === 'AIR' && a.firstContact && !a.landedAt);
    const flow = arr.filter(a => this.committed(a)).map(a => ({ ac: a, ...this.tm(a, f) }));
    const mine = this.ojti('approach');

    for (const x of flow) {
      const ac = x.ac, o = this.st(ac);
      if (mine && !o.manual.lat && ac.app?.state === 'ARMED' && !ac.app.viaIF && o.stage === 'INT' && this.free(ac)) {
        const L = this.local(f, ac.x, ac.y);
        if (Math.abs(L.s) > 0.4) this.steer(ac, f.c - Math.sign(L.s) * 30, 20);
      }
      if (ac.app || ac.nordo) continue;
      if (!mine || o.manual.lat) { this.userVectorHints(ac, f, flow); continue; }
      if (!f.ok) { this.toHold(ac); continue; }
      if (w.t < o.latHold || !this.free(ac)) continue;
      const L = this.local(f, ac.x, ac.y);
      if (!o.side) o.side = Math.sign(L.s) || 1;
      const sg = o.side;
      const urgent = ac.emergency || ac.priority;
      if (o.stage === 'DW') {
        if ((L.a >= (urgent ? URGENT_BASE : BASE_MIN) && ac.alt - this.gsAlt(f, L.a) <= (Math.abs(L.s) + 1) * 300 && (urgent || this.baseClear(ac, L, flow))) || (urgent && L.a > BASE_MAX)) {
          o.stage = 'BASE';
          const cmds = [{ t: 'HDG', v: round5(ac.wca(f.c - sg * 90)) }];
          if (!o.manual.spd && ac.alt < 10000) cmds.push({ t: 'SPD', v: Math.round(clamp(180, ac.perf.vmin, ac.maxIas())) });
          this.issue(ac, cmds);
          continue;
        }
        if (L.a > BASE_MAX) { this.toHold(ac); continue; }
        const off = Math.abs(L.s - sg * DW_OFFSET);
        const [px, py] = this.toWorld(f, L.a + Math.max(4, 0.8 * off), sg * DW_OFFSET);
        this.steer(ac, bearing(ac.x, ac.y, px, py));
        if (!o.manual.spd && ac.alt < 10000 && !ac.clr.spd && ac.ias > 225 && this.free(ac)) this.issue(ac, [{ t: 'SPD', v: Math.round(clamp(210, ac.perf.vmin + 10, ac.maxIas())) }]);
      } else if (o.stage === 'BASE') {
        if (Math.abs(L.s) <= 2.2 || Math.sign(L.s) !== sg) {
          const side = Math.abs(L.s) > 0.4 ? Math.sign(L.s) : sg; // overshot: intercept from the side it is now on
          this.issue(ac, [{ t: 'HDG', v: round5(ac.wca(f.c - side * 30)) }, { t: 'ILS', rwy: f.end.id }]);
          o.stage = 'INT';
        } else this.steer(ac, f.c - sg * 90, 20);
      } else if (o.stage === null) o.stage = 'DW'; // committed some other way (go-around)
    }
    if (!mine || !f.ok) { if (!mine) this.userReleaseHints(arr, f, flow); return; }
    this.spacing(flow, f);

    // bring one holding / inbound aircraft into the flow per think
    const full = flow.filter(x => !x.ac.onFinal).length >= MAX_COMMITTED;
    const cand = arr.filter(a => !this.committed(a) && !a.nordo && !this.st(a).manual.lat && (a.nav.mode === 'HOLD' || a.nav.mode === 'ROUTE' || a.nav.mode === 'DCT') && this.free(a)
      && ((a.emergency || a.priority) || (!full && (a.nav.mode === 'HOLD' || Math.hypot(a.x, a.y) < 34 || a.route.length <= 1)
      && !arr.some(b => b !== a && !this.committed(b) && b.alt < a.alt - 300 && b.alt > f.ifAlt - 900 && dist(a.x, a.y, b.x, b.y) < 8)))) // leave the stack from the bottom

    this.spawn = { arr: 20, dep: 45, ovr: 90 };
    this.events = (scenario?.events || []).map(e => ({ ...e, done: false }));
    this.scripted = (scenario?.traffic || []).map(e => ({ ...e, done: false }));
    this.randomTraffic = scenario ? scenario.randomTraffic !== false : true;
    this.specialsUnlocked = SPECIALS.filter(s => specials.includes(s.type));
    this.ended = false;
    this.selected = null;
    this.messages = [];
    this.handled = 0;
    this.assist = assist && assist.mode !== 'off' && mode !== 'tutorial' ? new Assist(this, assist) : null;
    if (this.scenario?.setup) this.scenario.setup(this);
    if (this.randomTraffic && mode !== 'tutorial') this.prefill();
  }

  get clock() { return this.startUTC + this.t; }
  // Legacy automation flags (auto release / landing clearance / approach). The instructor replaces them when active.
  auto(key) { return !this.assist && !!this.settings[key]; }

  // ---------- comms ----------
  say(from, text, opts = {}) {
    const m = { t: this.t, from, text, ...opts };
    this.messages.push(m);
    if (this.messages.length > 400) this.messages.shift();
    this.bus?.emit('comms', m);
  }
  pilotSay(ac, text, speech, opts = {}) { this.say('PILOT', `${ac.callsign}: ${text}`, { ac: ac.id, cs: ac.callsign, speech, voice: ac.callsign, op: ac.op, ...opts }); }
  sys(text, level = 'info') { this.say('SYS', text, { level }); }

  // ---------- spawning ----------
  addAircraft(spec) {
    if (!spec) return null;
    const callsign = spec.callsign || makeCallsign(this.rng, spec.op, this.usedCallsigns);
    this.usedCallsigns.add(callsign);
    const ac = new Aircraft(this, { ...spec, id: this.nextId++, callsign, rt: spec.op.rt, op: spec.op.icao, ga: spec.op.ga, squawk: makeSquawk(this.rng, this.usedSquawks), labelPos: this.rng.int(0, 3) });
    if (spec.rfl) ac.rfl = spec.rfl;
    ac.nominal = this.nominalTime(ac);
    this.aircraft.push(ac);
    this.bus?.emit('spawn', ac);
    const delay = this.rng.range(2, 7);
    ac.schedule(delay, () => this.firstContact(ac));
    return ac;
  }

  nominalTime(ac) {
    let d = 0, px = ac.x, py = ac.y;
    for (const f of ac.route) { const p = this.ap.fixes[f]; d += dist(px, py, p.x, p.y); px = p.x; py = p.y; }
    if (ac.kind === 'ARR') d = dist(ac.x, ac.y, 0, 0) * 1.25 + 8;
    ac.nominalTrack = d;
    return (d / Math.max(140, Math.min(260, ac.perf.vcruise))) * 3600;
  }

  firstContact(ac) {
    if (ac.phase === 'GONE') return;
    ac.firstContact = true;
    const ap = this.ap, atis = this.weather.atis;
    const cs = spokenCallsign(ac);
    if (ac.kind === 'DEP') {
      this.pilotSay(ac, `ready for departure runway ${ac.depRwy}, ${ac.routeName}`, `${ap.raw.city} tower, ${cs}, ready for departure ${spokenRwy(ac.depRwy)}`);
    } else {
      const lvl = fmtAlt(ac.alt, ap.ta);
      const extra = ac.special ? (ac.perf.glider ? ', unpowered glide, request straight-in' : ', request full stop') : '';
      this.pilotSay(ac, `${lvl}${ac.kind === 'ARR' ? ', inbound ' + ac.routeName + ', information ' + atis : ', ' + ac.routeName}${extra}`,
        `${ap.raw.city} approach, ${cs}, ${spokenAlt(ac.alt, ap.ta)}${ac.kind === 'ARR' ? ', information ' + letter(atis) : ''}${extra}`);
    }
  }

  prefill() {
    // a few aircraft already in the sector so the scope isn't empty at start
    const n = Math.round(2 + 2 * this.settings.density);
    for (let i = 0; i < n; i++) {
      const s = arrivalSpec(this, { back: -this.rng.range(4, 16) });
      if (s) this.addAircraft(s);
    }
    this.addAircraft(departureSpec(this));
    if (this.rng.chance(0.6)) this.addAircraft(overflightSpec(this));
  }

  spawnTick(dt) {
    if (!this.randomTraffic) return;
    const s = this.settings, ap = this.ap;
    const cap = Math.round(14 + 26 * s.density);
    const live = this.aircraft.filter(a => a.phase !== 'GONE').length;
    const rateArr = s.arrivalRate * s.density, rateDep = rateArr * ap.traffic.depShare / (1 - ap.traffic.depShare), rateOvr = rateArr * ap.traffic.overShare * 1.6;
    for (const [k, rate] of [['arr', rateArr], ['dep', rateDep], ['ovr', rateOvr]]) {
      this.spawn[k] -= dt;
      if (this.spawn[k] > 0) continue;
      const mean = 3600 / Math.max(0.5, rate);
      this.spawn[k] = Math.max(mean * 0.35, -Math.log(1 - this.rng.next()) * mean);
      if (live >= cap) continue;
      if (k === 'arr') {
        const special = s.specials && this.specialsUnlocked.length && this.rng.chance(0.06) && !this.aircraft.some(a => a.special && a.phase !== 'GONE');
        const spec = special ? specialSpec(this, this.rng.pick(this.specialsUnlocked)) : arrivalSpec(this);
        if (spec) this.addAircraft(spec); else this.spawn[k] = 20;
      } else if (k === 'dep') {
        if (this.aircraft.filter(a => a.phase === 'HOLDING_POINT').length < 4) this.addAircraft(departureSpec(this));
      } else this.addAircraft(overflightSpec(this));
    }
  }

  // ---------- commands ----------
  parseCtx(selected) {
    return {
      callsigns: this.aircraft.filter(a => a.phase !== 'GONE' && !a.handedOff).map(a => a.callsign),
      fixes: Object.keys(this.ap.fixes), runways: Object.keys(this.ap.ends), ceiling: 45000,
      selected: selected || null,
    };
  }

  issue(text, selected) {
    const res = parseCommand(text, this.parseCtx(selected), { lenient: this.settings.lenient });
    if (!res.ok) return res;
    const ac = this.aircraft.find(a => a.callsign === res.callsign);
    this.dispatch(ac, res.cmds, text);
    if (ac) this.assist?.onUserCommand(ac, res.cmds);
    return res;
  }

  find(id) { return this.aircraft.find(a => a.id === id); }
  find1(cs) { return this.aircraft.find(a => a.callsign === cs); }

  // by: 'OJTI' when the training instructor issued it (shown in its own colour, never mis-read back)
  dispatch(ac, cmds, text, by = null) {
    if (!ac) return;
    const shown = text || cmds.map(c => c.t).join(' ');
    let speech;
    if (by) {
      const owner = this.ap.exitOwner[ac.exitFix] || this.ap.adjacent[0];
      speech = instruction(ac, cmds.map(c => (c.t === 'HO' && owner ? { ...c, unit: owner.name, freq: owner.freq } : c)), this.ap, Math.round(this.weather.qnh));
    }
    this.say(by || 'ATC', `${ac.callsign} ${shown.replace(new RegExp('^\\s*' + ac.callsign + '\\s*', 'i'), '').toUpperCase()}`, { ac: ac.id, cmd: true, speech });
    ac.lastCmdAt = this.t;
    if (ac.nordo) return; // silence
    const s = this.settings;
    const delay = this.rng.range(s.respMin, s.respMax) * (ac.special ? 0.7 : 1);
    // correction of a previous readback error
    if (ac.rbErr && cmds.some(c => c.t === ac.rbErr.t)) ac.rbErr = null;

    const unable = [];
    const ok = [];
    for (const c0 of cmds) {
      const c = { ...c0 };
      const why = this.validate(ac, c);
      if (why) unable.push(why); else ok.push(c);
    }
    const ground = ok.filter(c => ['LU', 'TO', 'REL'].includes(c.t));
    const ho = ok.find(c => c.t === 'HO');
    const air = ok.filter(c => !['LU', 'TO', 'REL', 'HO'].includes(c.t));

    // readback error injection on one numeric instruction
    let wrong = null;
    if (air.length && !by && this.rng.chance(s.readbackError)) {
      const cand = air.filter(c => ['HDG', 'ALT', 'SPD'].includes(c.t));
      if (cand.length) {
        const c = this.rng.pick(cand);
        const right = { ...c };
        if (c.t === 'HDG') c.v = norm360(c.v + this.rng.pick([-20, -10, 10, 20])) || 360;
        if (c.t === 'ALT') c.v = Math.max(1000, c.v + this.rng.pick([-1000, 1000]));
        if (c.t === 'SPD') c.v = c.v + this.rng.pick([-20, -10, 10, 20]);
        wrong = { t: c.t, right, wrong: { ...c } };
      }
    }

    ac.schedule(delay, () => {
      if (ac.phase === 'GONE') return;
      if (unable.length) this.pilotSay(ac, `unable, ${unable.join('; ')}`, `unable, ${unable.join(', ')}, ${spokenCallsign(ac, true)}`, { unable: true });
      for (const c of ground) this.groundCmd(ac, c);
      if (air.length) {
        ac.apply(air);
        const rb = readback(ac, air.map(c => (c.t === 'CL' ? { ...c, rwy: ac.app?.rwy } : c)), this.ap, Math.round(this.weather.qnh));
        if (wrong) ac.rbErr = { ...wrong, at: this.t };
        this.pilotSay(ac, rb.text, rb.speech, { rbErr: !!wrong });
        if (ac.kind === 'ARR' && ac.strip.state === 'INBOUND') ac.strip.state = 'CONTROL';
      }
      if (ho) this.handoff(ac);
    });
  }

  validate(ac, c) {
    const p = ac.perf, ap = this.ap;
    switch (c.t) {
      case 'SPD': {
        const appr = ac.app && ac.distToThr() < 20;
        const min = appr ? p.vapp : p.vmin;
        if (c.v < min) return `minimum speed ${min}`;
        if (c.v > ac.maxIas()) return `maximum speed ${Math.floor(ac.maxIas())} knots at this level`;
        if (ac.alt < 10000 && c.v > 250 && ac.kind !== 'OVR' && !ac.special) return 'speed limit 250 below FL100';
        return null;
      }
      case 'MACH':
        if (!p.mmo) return 'unable Mach, assign speed in knots';
        if (c.v > p.mmo) return `maximum Mach ${p.mmo.toFixed(2)}`;
        if (machToCas(c.v, ac.alt) < p.vmin) return 'Mach too low at this level';
        if (ac.alt < 10000 && !ac.special) return 'Mach not assigned below FL100';
        return null;
      case 'ALT':
        if (c.v > p.ceiling) return `maximum ${fmtAlt(p.ceiling, ap.ta)}`;
        if (p.glider && c.v > ac.alt + 100) return 'no engine, unable to climb';
        return null;
      case 'HOLD': return p.glider ? 'unpowered, unable to hold' : null;
      case 'ILS': {
        const e = ap.ends[c.rwy];
        if (!e.ils) return `no ILS runway ${c.rwy}`;
        if (e.ils.status !== 'OK') return `ILS ${c.rwy} unserviceable`;
        if (e.runway.closed) return `runway ${c.rwy} closed`;
        if (ac.kind !== 'ARR') return 'not landing here';
        return null;
      }
      case 'CL':
        if (!ac.app) return 'not on approach';
        if (ac.app.end.runway.closed) return 'runway closed';
        return null;
      case 'LU': case 'TO': case 'REL':
        if (ac.kind !== 'DEP' || !['HOLDING_POINT', 'LINEUP'].includes(ac.phase)) return 'already airborne';
        if (this.ap.ends[ac.depRwy].runway.closed && c.t !== 'REL') return 'runway closed';
        return null;
      case 'GA': return ac.app ? null : 'not on approach';
      default: return null;
    }
  }

  groundCmd(ac, c) {
    const rwy = ac.depRwy;
    if (c.t === 'REL') {
      if (ac.strip.state === 'PENDING') { ac.strip.state = 'RELEASED'; this.say('TWR', `${ac.callsign} released, tower will depart when able`); }
      return;
    }
    if (c.t === 'LU') {
      ac.phase = 'LINEUP'; ac.strip.state = 'LINEUP';
      this.pilotSay(ac, `line up and wait runway ${rwy}`, `lining up and wait ${spokenRwy(rwy)}, ${spokenCallsign(ac, true)}`);
      return;
    }
    if (c.t === 'TO') this.takeoff(ac, true);
  }

  takeoff(ac, byController) {
    const rwy = ac.depRwy;
    const prev = this.lastDep[rwy];
    if (prev && this.t - prev.t < 120 && ['H', 'J'].includes(prev.wake) && !['H', 'J'].includes(ac.wake)) {
      this.incident('WAKE', [ac.id], `${ac.callsign} departed ${Math.round(this.t - prev.t)}s behind heavy (2 min required)`);
    }
    ac.phase = 'TAKEOFF'; ac.ias = 0; ac.strip.state = 'TAKEOFF';
    this.lastDep[rwy] = { t: this.t, wake: ac.wake, id: ac.id };
    if (byController) this.pilotSay(ac, `cleared for take-off runway ${rwy}`, `cleared for take-off ${spokenRwy(rwy)}, ${spokenCallsign(ac, true)}`);
    else this.say('TWR', `${ac.callsign} rolling runway ${rwy}`);
  }

  handoff(ac) {
    const ap = this.ap;
    if (ac.kind === 'ARR') { this.pilotSay(ac, 'unable, inbound for landing', 'negative, we are inbound for landing', { unable: true }); return; }
    const exit = ap.fixes[ac.exitFix];
    const owner = ap.exitOwner[ac.exitFix] || ap.adjacent[0];
    const dExit = exit ? dist(ac.x, ac.y, exit.x, exit.y) : 0;
    const farOut = Math.hypot(ac.x, ac.y) > ap.sectorRadius - 18;
    let reason = null;
    if (ac.phase !== 'AIR') reason = 'not yet airborne';
    else if (dExit > 28 && !farOut) reason = `not yet near ${ac.exitFix}`;
    else if (ac.kind === 'DEP' && Math.max(ac.alt, ac.clr.alt) < owner.minAlt) reason = `climb to at least ${fmtAlt(owner.minAlt, ap.ta)}`;
    else if (this.alerts.some(a => (a.type === 'STCA' || a.type === 'LOS') && a.ids.includes(ac.id))) reason = 'in conflict';
    if (reason) {
      this.score.add('handoffRejected', POINTS.handoffRejected, this.t, ac.callsign);
      this.say('SECTOR', `${owner.name}: unable ${ac.callsign}, ${reason}`, { level: 'warn' });
      this.assist?.onHandoffRejected(ac, reason);
      return;
    }
    this.completeHandoff(ac, owner, false);
  }

  completeHandoff(ac, owner, late) {
    ac.handedOff = true; ac.controlled = false; ac.handoffAt = this.t; ac.strip.state = 'HANDED';
    if (ac.kind === 'DEP') { ac.clr.alt = Math.min(ac.perf.ceiling, Math.max(ac.clr.alt, 24000)); if (!ac.route.length) ac.nav.mode = 'HDG'; }
    if (ac.kind === 'OVR' && ac.nav.mode !== 'ROUTE') ac.apply([{ t: 'RES' }]);
    if (late) {
      this.score.add('handoffLate', POINTS.handoffLate, this.t, ac.callsign);
      this.score.stats.lateHandoffs++;
      this.say('SECTOR', `${owner.name}: ${ac.callsign} entered my airspace without a handoff`, { level: 'warn' });
    } else {
      const pts = ac.kind === 'OVR' ? POINTS.overflightHandoff : POINTS.handoff;
      this.score.add('handoff', pts, this.t, ac.callsign);
      const rb = readback(ac, [{ t: 'HO', unit: owner.name, freq: owner.freq }], this.ap, 0);
      this.pilotSay(ac, rb.text, rb.speech);
    }
    this.score.stats.handoffs++;
    if (ac.kind === 'OVR') this.score.stats.overflights++; else this.score.stats.departures++;
    this.handled++;
    this.assist?.onHandoff(ac, late);
    this.bus?.emit('handoff', ac);
  }

  // ---------- runway logic ----------
  runwaysConflict(a, b) { return a === b || segIntersect(a, b); }
  runwayUsers(rw) {
    return this.aircraft.filter(a => {
      if (a.phase === 'LINEUP' || a.phase === 'TAKEOFF') return this.ap.ends[a.depRwy].runway === rw;
      if (a.phase === 'ROLLOUT') return a.landRwy === rw;
      return false;
    });
  }
  runwayOccupied(rw, except) {
    return this.ap.runways.some(r => this.runwaysConflict(r, rw) && this.runwayUsers(r).some(a => a !== except));
  }
  setRunway(kind, id) {
    if (!this.ap.ends[id]) return;
    this.runwayConfig[kind] = id;
    this.sys(`Runway ${id} now in use for ${kind === 'arr' ? 'arrivals' : 'departures'}`);
    if (kind === 'dep') {
      for (const a of this.aircraft) if (a.phase === 'HOLDING_POINT') {
        const sids = this.ap.sids.filter(s => s.rwy === id);
        const sid = sids.find(s => s.exit === a.exitFix) || sids[0];
        if (sid) { a.depRwy = id; a.route = sid.route.slice(); a.routeName = sid.name; const e = this.ap.ends[id]; a.x = e.thrX; a.y = e.thrY; a.hdg = e.hdg; }
      }
    }
    this.weather.atisIdx++;
    this.bus?.emit('atis', this.weather.atis);
  }

  towerTick() {
    const auto = this.auto('autoRelease');
    for (const ac of this.aircraft) {
      if (ac.phase !== 'HOLDING_POINT' && ac.phase !== 'LINEUP') continue;
      if (auto && ac.strip.state === 'PENDING' && this.t - ac.enteredAt > 25) ac.strip.state = 'RELEASED';
      if (ac.strip.state !== 'RELEASED' && ac.strip.state !== 'LINEUP') continue;
      if (ac.strip.state === 'LINEUP' && !ac.autoLU) continue; // controller lined up manually: waits for TO
      const end = this.ap.ends[ac.depRwy];
      if (end.runway.closed) continue;
      const prev = this.lastDep[ac.depRwy];
      const gap = prev ? (['H', 'J'].includes(prev.wake) && !['H', 'J'].includes(ac.wake) ? 125 : 75) : 0;
      if (prev && this.t - prev.t < gap) continue;
      // a faster aircraft behind a slow climber would catch it on the climb-out: wait until it is well clear
      const pa = prev && this.find(prev.id);
      if (pa && pa.phase === 'AIR' && pa.perf.vcruise < ac.perf.vcruise - 40 && Math.hypot(pa.x, pa.y) < 12) continue;
      const busy = this.runwayOccupied(end.runway, ac);
      // seconds until the next arrival reaches this runway: line up only with time to depart before it arrives
      let tArr = 1e9;
      for (const a of this.aircraft) if (a.app && a.phase === 'AIR' && this.runwaysConflict(a.app.end.runway, end.runway)) tArr = Math.min(tArr, a.distToThr() / Math.max(100, a.gs) * 3600);
      if (busy || tArr < (ac.phase === 'HOLDING_POINT' ? 140 : 70)) continue;
      if (ac.phase === 'HOLDING_POINT') { ac.phase = 'LINEUP'; ac.strip.state = 'LINEUP'; ac.autoLU = true; ac.luT = this.t; continue; }
      if (this.t - ac.luT > 15) this.takeoff(ac, false);
      break; // one movement per tick
    }
  }

  // ---------- hooks from aircraft ----------
  onAirborne(ac) { ac.strip.state = 'AIRBORNE'; ac.controlled = true; }
  onFixPassed() {}
  onEvent(ac, kind, info) {
    if (kind === 'LOC' && ac.strip.state !== 'LANDING') ac.strip.state = 'FINAL';
    if (kind === 'LOCMISS') this.pilotSay(ac, 'we have flown through the localiser, request vectors', `${spokenCallsign(ac, true)}, we've gone through the localiser, request vectors`);
    if (kind === 'AUTOCL') this.say('TWR', `${ac.callsign} cleared to land runway ${ac.app.rwy}`);
    this.assist?.onEvent(ac, kind);
    if (kind === 'GLIDER') this.pilotSay(ac, `no go-around possible, landing ${ac.app?.rwy || ''}`, `${spokenCallsign(ac, true)}, we're committed, no go-around capability`, { level: 'warn' });
  }
  onGoAround(ac, reason) {
    const ctl = !/weather|wind|ILS failure|runway closed/.test(reason);  // events outside the controller's hands
    this.score.stats.goArounds++;
    if (ctl) this.score.stats.goAroundsCtl++;
    this.score.add('goAround', ctl ? POINTS.goAroundCtl : POINTS.goAroundWx, this.t, `${ac.callsign}: ${reason}`);
    ac.strip.state = 'CONTROL';
    this.pilotSay(ac, `going around, ${reason}`, `${spokenCallsign(ac, true)}, going around, ${reason}`, { level: 'warn' });
    this.assist?.onGoAround(ac, reason);
    this.bus?.emit('goaround', { ac, reason });
  }
  onTouchdown(ac) {
    ac.landRwy = ac.app.end.runway; ac.landedAt = this.t; ac.strip.state = 'LANDED'; ac.controlled = false;
    this.assist?.onTouchdown(ac);
    const st = this.score.stats;
    st.landings++; this.handled++;
    let pts = POINTS.landing;
    if (ac.emergency) { pts += POINTS.emergencyLanded; st.emergencies++; }
    if (ac.special) { pts += POINTS.specialLanded; st.specials++; }
    const delay = Math.max(0, (this.t - ac.enteredAt) - ac.nominal * 1.2) / 60;
    st.delayMin += delay;
    pts += Math.round(delay * POINTS.delayPerMin * (ac.priority || ac.emergency ? 3 : 1));
    const extra = Math.max(0, ac.trackMiles - ac.nominalTrack * 1.15);
    st.extraTrack += extra;
    pts += Math.round(extra * POINTS.extraTrackPerNm);
    this.score.add('landing', pts, this.t, `${ac.callsign} landed ${ac.app.rwy}${delay > 0.5 ? `, ${delay.toFixed(1)} min delay` : ''}`);
    this.say('TWR', `${ac.callsign} landed runway ${ac.app.rwy}`);
    this.bus?.emit('landed', ac);
  }
  onVacated() {}

  // ---------- events ----------
  runEvent(e) {
    const rng = this.rng;
    const pickAir = (kinds, filt = () => true) => {
      const c = this.aircraft.filter(a => a.phase === 'AIR' && kinds.includes(a.kind) && a.controlled && !a.emergency && !a.nordo && !a.special && !a.onFinal && filt(a));
      return e.target ? this.aircraft.find(a => a.callsign === e.target) || null : c.length ? rng.pick(c) : null;
    };
    switch (e.type) {
      case 'emergency': {
        const ac = pickAir(['ARR']);
        if (!ac) return false;
        ac.emergency = '7700'; ac.squawk = '7700'; ac.priority = true; ac.emergT = this.t;
        // fair deadline: 15 min, or the straight-in flying time at its own approach speed plus 8 min if that is longer
        ac.emergDue = Math.max(900, (dist(ac.x, ac.y, 0, 0) * 1.3 + 6) / Math.max(90, ac.perf.vapp + 20) * 3600 + 480);
        const what = e.what || rng.pick(['engine failure', 'smoke in the cabin', 'hydraulic failure', 'low fuel']);
        if (what === 'engine failure') ac.perf = { ...ac.perf, vmax: Math.min(ac.perf.vmax, 250), climb: [ac.perf.climb[0] * 0.4, ac.perf.climb[1] * 0.3] };
        const rwy = this.runwayConfig.arr;
        this.pilotSay(ac, `MAYDAY MAYDAY MAYDAY, ${what}, request immediate ILS ${rwy}`, `Mayday mayday mayday, ${spokenCallsign(ac)}, ${what}, request immediate ILS approach ${spokenRwy(rwy)}`, { level: 'alert' });
        return true;
      }
      case 'medical': {
        const ac = pickAir(['ARR']);
        if (!ac) return false;
        ac.medical = true; ac.priority = true;
        this.pilotSay(ac, 'PAN PAN, medical emergency on board, request priority', `Pan pan, pan pan, pan pan, ${spokenCallsign(ac)}, we have a medical emergency on board, request priority landing`, { level: 'warn' });
        return true;
      }
      case 'nordo': {
        const ac = pickAir(['ARR', 'OVR']);
        if (!ac) return false;
        ac.nordo = true; ac.squawk = '7600'; ac.prevSquawk = ac.squawk;
        this.sys(`${ac.callsign} squawking 7600: radio failure. Aircraft will continue on its cleared route and land without clearance.`, 'warn');

    this.scene.resize(W, H);
    this.b1.resize(W / 2, H / 2); this.b1b.resize(W / 2, H / 2);
    this.b2.resize(W / 8, H / 8); this.b2b.resize(W / 8, H / 8);
    this.setRange(keepRange);
    return true;
  }

  // ---------- view ----------
  setRange(nm) { this.range = Math.max(2, Math.min(200, nm)); this.view.scale = Math.min(this.w, this.h) / 2 / this.range; }
  zoomAt(sx, sy, f) {
    const [wx, wy] = this.toWorld(sx, sy);
    this.setRange(this.range / f);
    const [nx, ny] = this.toWorld(sx, sy);

  }
  pan(dx, dy) { this.view.cx -= dx / this.view.scale; this.view.cy += dy / this.view.scale; }
  center(x = 0, y = 0) { this.view.cx = x; this.view.cy = y; }
  toScreen(x, y) { return [this.w / 2 + (x - this.view.cx) * this.view.scale, this.h / 2 - (y - this.view.cy) * this.view.scale]; }
  toWorld(sx, sy) { return [this.view.cx + (sx - this.w / 2) / this.view.scale, this.view.cy - (sy - this.h / 2) / this.view.scale]; }

  // ---------- static map ----------
  buildMap(ap, s) {
    const key = [ap.id, this.style, s.rangeRings, s.showMva, s.showAirways, s.showSidStar, s.showTerrain, ap.runways.map(r => r.closed).join()].join('|');
    if (key === this.mapKey) return;
    this.mapKey = key;
    const P = this.pal, { tri, lines, syms } = this.map;
    tri.clear(); lines.clear(); syms.clear();
    for (const poly of ap.land) tri.polygon(poly, triangulate(poly), P.land);
    for (const r of ap.restricted) tri.polygon(r.poly, triangulate(r.poly), P.restrFill);
    if (s.showTerrain) for (const t of ap.terrain) lines.poly(t.line, P.terrain, 1, 6);
    if (s.showMva) for (const m of ap.mva) lines.poly(m.poly, P.mva, 1, 0, true);
    for (const c of ap.coast) lines.poly(c, P.coast, 1.6);
    for (const r of ap.restricted) lines.poly(r.poly, P.restr, 1.4, 9, true);
    // range rings + sector boundary + compass rose
    if (s.rangeRings) for (let r = 5; r < ap.sectorRadius; r += 5) lines.circle(0, 0, r, r % 10 === 0 ? P.ring : [P.ring[0], P.ring[1], P.ring[2], P.ring[3] * 0.5], r % 10 === 0 ? 1 : 0.8, r % 10 === 0 ? 0 : 4);
    lines.circle(0, 0, ap.sectorRadius, P.rose, 1.4, 0, 180);
    for (let b = 0; b < 360; b += 5) {
      const [ux, uy] = hdgVec(b); const R = ap.sectorRadius, k = b % 30 === 0 ? 2.2 : b % 10 === 0 ? 1.3 : 0.7;
      lines.seg(ux * R, uy * R, ux * (R - k), uy * (R - k), P.rose, b % 30 === 0 ? 1.6 : 1);
    }
    if (s.showAirways) for (const aw of ap.airways) {
      const pts = aw.route.map(f => [ap.fixes[f].x, ap.fixes[f].y]);
      lines.poly(pts, P.airway, 2.2);
    }
    if (s.showSidStar) {
      for (const st of ap.stars) lines.poly(st.route.map(f => [ap.fixes[f].x, ap.fixes[f].y]), P.sidstar, 1.2, 10);
      for (const sd of ap.sids) {
        const e = ap.ends[sd.rwy]; const [ux, uy] = hdgVec(e.hdg);
        const start = [e.thrX + ux * e.runway.length, e.thrY + uy * e.runway.length];
        lines.poly([start, ...sd.route.map(f => [ap.fixes[f].x, ap.fixes[f].y])], P.sidstar, 1.2, 4);
      }
    }
    // holding patterns
    for (const h of Object.values(ap.holds)) {
      const f = ap.fixes[h.fix]; if (!f) continue;
      const pts = racetrack(f.x, f.y, h.inbound, h.turn, 4, 1.6);
      lines.poly(pts, P.hold, 1, 5, true);
    }
    // runways and extended centrelines
    for (const rw of ap.runways) {
      const [a, b] = rw.ends;
      lines.seg(a.thrX, a.thrY, b.thrX, b.thrY, rw.closed ? P.alert : P.runway, 4);
      for (const e of rw.ends) {
        if (!e.ils) continue;
        const [ox, oy] = hdgVec(norm360(e.hdg + 180)), [nx, ny] = [oy, -ox];
        lines.seg(e.thrX + ox * 0.3, e.thrY + oy * 0.3, e.thrX + ox * 15, e.thrY + oy * 15, P.cl, 1, 7);
        for (let d = 1; d <= 15; d++) {
          const k = d % 5 === 0 ? 0.55 : 0.22, cx = e.thrX + ox * d, cy = e.thrY + oy * d;
          lines.seg(cx - nx * k, cy - ny * k, cx + nx * k, cy + ny * k, P.cl, 1);
        }
        // feather at the localiser limit
        for (const sgn of [-1, 1]) {
          const [fx, fy] = hdgVec(norm360(e.hdg + 180 + sgn * 4));

      }
    }
    // fixes
    for (const f of Object.values(ap.fixes)) {
      if (f.kind === 'faf') syms.add(f.x, f.y, 7, SHAPE.FTRI, P.cl);
      else if (f.kind === 'if') syms.add(f.x, f.y, 7, SHAPE.TRI, P.cl);
      else syms.add(f.x, f.y, 9, SHAPE.TRI, P.fix);

    for (const sp of ap.spots) syms.add(sp.x, sp.y, 4, SHAPE.DOT, P.terrain);
    syms.add(ap.tower.x, ap.tower.y, 6, SHAPE.FSQUARE, P.dim);
  }

  // ---------- frame ----------
  render(f) {
    const { world, settings: s } = f;
    if (this.lost) return;
    this.resize();
    if (s.style !== this.style) { this.style = s.style; this.mapKey = ''; this.overlay.style.filter = this.pal.glow; }
    const gl = this.gl, P = this.pal, ap = world.ap;
    this.buildMap(ap, s);
    const W = this.canvas.width, H = this.canvas.height;
    const v = { cx: this.view.cx, cy: this.view.cy, scale: this.view.scale * this.dpr };
    const phos = this.style === 'phosphor';
    const tNow = world.t + f.alpha * SIM_DT;

    // ----- dynamic geometry -----
    const L = this.dyn.lines, S = this.dyn.syms, T = this.dyn.top;
    L.clear(); S.clear(); T.clear();
    const ang = ((tNow % SWEEP) / SWEEP) * TAU;
    const live = world.aircraft.filter(a => a.phase === 'AIR' || a.phase === 'TAKEOFF' || a.phase === 'ROLLOUT');
    if (phos) this.sweepPaint(live, ang, tNow, f.alpha);
    this.positions = new Map();
    const alertIds = new Map();
    for (const al of world.alerts) for (const id of al.ids) {
      const lvl = al.type === 'LOS' || al.type === 'STCA' || al.type === 'RWY' || al.type === 'MSAW' ? 2 : 1;
      alertIds.set(id, Math.max(lvl, alertIds.get(id) || 0));
    }
    this.alertIds = alertIds;
    const blink = (performance.now() / 400 | 0) % 2 === 0;

    for (const a of live) {
      const ix = a.px + (a.x - a.px) * f.alpha, iy = a.py + (a.y - a.py) * f.alpha;
      let px = ix, py = iy, glow = 1;
      if (phos) {
        const p = this.paint.get(a.id);
        if (p) { px = p.x; py = p.y; glow = 0.35 + 0.65 * Math.exp(-(tNow - p.t) / (SWEEP * 0.45)); }
        else continue;
      }
      this.positions.set(a.id, [px, py]);
      const sel = f.selectedId === a.id;
      const stealth = a.perf.stealth;
      const al = alertIds.get(a.id) || 0;
      let col = a.handedOff || !a.firstContact ? P.dim : a.kind === 'ARR' ? P.arr : a.kind === 'DEP' ? P.dep : P.ovr;
      if (a.emergency || al === 2) col = blink || !a.emergency ? P.alert : P.warn;
      else if (al === 1) col = P.warn;
      if (sel) col = P.sel;
      const ca = [col[0], col[1], col[2], (col[3] ?? 1) * glow * (stealth ? 0.32 : 1)];
      // trail (one plot per sweep)
      const nTrail = s.trails;
      const hist = a.history;
      for (let k = 0; k < Math.min(nTrail, hist.length); k++) {
        const hpt = hist[hist.length - 1 - k];
        if (phos && p0(this.paint.get(a.id), hpt)) continue;
        const fade = 1 - k / (nTrail + 1);
        S.add(hpt.x, hpt.y, phos ? 3.4 : 3, SHAPE.DOT, [P.trail[0], P.trail[1], P.trail[2], 0.55 * fade * (stealth ? 0.4 : 1)]);
      }
      // speed vector
      if (s.vectorMin > 0 && a.phase === 'AIR') {
        const k = s.vectorMin / 60;
        L.seg(px, py, px + a.vx * k, py + a.vy * k, [ca[0], ca[1], ca[2], 0.8 * glow], sel ? 1.6 : 1.2);
      }
      // target
      if (phos) {
        S.add(px, py, 22, SHAPE.GLOW, [ca[0], ca[1], ca[2], 0.35 * ca[3]]);
        T.add(px, py, stealth ? 5 : 7, SHAPE.DOT, ca);
      } else {
        const shape = !a.firstContact || a.handedOff ? SHAPE.DIAMOND : a.kind === 'OVR' ? SHAPE.RING : SHAPE.SQUARE;
        T.add(px, py, 10, shape, ca);
        if (stealth) T.add(px, py, 3, SHAPE.DOT, ca);
      }
      if (sel) T.add(px, py, 26, SHAPE.RING, [P.sel[0], P.sel[1], P.sel[2], 0.6]);
      if (a.ident > 0 && blink) T.add(px, py, 30, SHAPE.SQUARE, P.sel);
      if (a.emergency || a.nordo) T.add(px, py, 34, SHAPE.RING, [P.alert[0], P.alert[1], P.alert[2], blink ? 0.9 : 0.35]);
    }
    // aircraft on the ground waiting (small dim markers at the threshold)
    for (const a of world.aircraft) if (a.phase === 'HOLDING_POINT' || a.phase === 'LINEUP') {
      const e = ap.ends[a.depRwy]; const [nx, ny] = hdgVec(norm360(e.hdg - 90));
      const off = a.phase === 'LINEUP' ? 0 : 0.18;
      T.add(e.thrX + nx * off, e.thrY + ny * off, 5, a.phase === 'LINEUP' ? SHAPE.FSQUARE : SHAPE.SQUARE, f.selectedId === a.id ? P.sel : P.dim);
    }
    // selected aircraft helpers: route path, cleared heading
    const sel = world.find(f.selectedId);
    if (sel && sel.phase === 'AIR') {
      const p = this.positions.get(sel.id) || [sel.x, sel.y];
      if (s.helpPaths && (sel.nav.mode === 'ROUTE' || sel.nav.mode === 'DCT')) {
        let prev = p;
        const route = sel.nav.mode === 'DCT' ? [sel.nav.fix] : sel.route;
        for (const fx of route) { const q = ap.fixes[fx]; if (!q) continue; L.seg(prev[0], prev[1], q.x, q.y, [P.sel[0], P.sel[1], P.sel[2], 0.45], 1.2, 8); prev = [q.x, q.y]; }
      }
      if (sel.nav.mode === 'HDG' && sel.clr.hdg != null) {
        const [ux, uy] = hdgVec(sel.clr.hdg);
        L.seg(p[0], p[1], p[0] + ux * 12, p[1] + uy * 12, [P.sel[0], P.sel[1], P.sel[2], 0.35], 1, 5);
      }
      if (sel.app && sel.app.state === 'ARMED') {
        const e = sel.app.end; L.seg(e.thrX, e.thrY, e.if?.x ?? e.thrX, e.if?.y ?? e.thrY, [P.sel[0], P.sel[1], P.sel[2], 0.5], 2.5);
      }
    }
    // conflict probes: connect STCA / LOS pairs and mark the predicted closest point
    if (s.helpProbes) for (const al of world.alerts) {
      if (al.type !== 'STCA' && al.type !== 'LOS' && al.type !== 'WAKE') continue;
      const [ia, ib] = al.ids; const pa = this.positions.get(ia), pb = this.positions.get(ib);
      if (!pa || !pb) continue;
      const c = al.type === 'WAKE' ? P.warn : P.alert;
      L.seg(pa[0], pa[1], pb[0], pb[1], [c[0], c[1], c[2], blink ? 0.85 : 0.4], 1.4, al.type === 'STCA' ? 6 : 0);
      if (al.type === 'STCA') {
        const A = world.find(ia), B = world.find(ib); const k = al.t / 3600;
        if (A && B) { S.add(A.x + A.vx * k, A.y + A.vy * k, 9, SHAPE.X, c); S.add(B.x + B.vx * k, B.y + B.vy * k, 9, SHAPE.X, c); }

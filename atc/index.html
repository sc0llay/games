    }
    // heading-drag vector and range/bearing line
    if (f.drag) {
      const d = f.drag;
      L.seg(d.x0, d.y0, d.x1, d.y1, d.kind === 'rbl' ? [P.warn[0], P.warn[1], P.warn[2], 0.9] : P.sel, 1.6, d.kind === 'rbl' ? 6 : 0);
      T.add(d.x1, d.y1, 8, d.kind === 'rbl' ? SHAPE.PLUS : SHAPE.X, d.kind === 'rbl' ? P.warn : P.sel);
    }

    // ----- GL passes -----
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    this.scene.bind();
    gl.clearColor(P.bg[0], P.bg[1], P.bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
    this.map.tri.draw(v, W, H);
    if (phos) {
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      const sp = this.progs.sweep; gl.useProgram(sp.p);
      const [hx, hy] = this.toScreen(0, 0);
      gl.uniform2f(sp.u.uRes, W, H); gl.uniform2f(sp.u.uHead, hx * this.dpr, (this.h - hy) * this.dpr);
      gl.uniform1f(sp.u.uAng, ang); gl.uniform1f(sp.u.uRadius, ap.sectorRadius * v.scale); gl.uniform3f(sp.u.uCol, ...P.sweep);
      fullscreen(gl);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    }
    this.map.lines.draw(v, W, H);
    this.map.syms.draw(v, W, H);
    if (phos) gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    S.draw(v, W, H);
    L.draw(v, W, H);
    T.draw(v, W, H);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.BLEND);

    // bloom: bright-pass at 1/2, blur; then 1/8, blur (wide halo)
    const bloomOn = s.bloom;
    if (bloomOn) {
      const pb = this.progs.bright, pbl = this.progs.blur;
      gl.useProgram(pb.p); this.b1.bind(); bindTex(gl, 0, this.scene.tex, pb.u.uTex); gl.uniform1f(pb.u.uThresh, phos ? 0.18 : 0.55); fullscreen(gl);
      gl.useProgram(pbl.p);
      for (let i = 0; i < 2; i++) {
        this.b1b.bind(); bindTex(gl, 0, this.b1.tex, pbl.u.uTex); gl.uniform2f(pbl.u.uDir, 1 / this.b1.w, 0); fullscreen(gl);
        this.b1.bind(); bindTex(gl, 0, this.b1b.tex, pbl.u.uTex); gl.uniform2f(pbl.u.uDir, 0, 1 / this.b1.h); fullscreen(gl);
      }
      this.b2.bind(); bindTex(gl, 0, this.b1.tex, pbl.u.uTex); gl.uniform2f(pbl.u.uDir, 0.5 / this.b1.w, 0); fullscreen(gl);
      for (let i = 0; i < 2; i++) {
        this.b2b.bind(); bindTex(gl, 0, this.b2.tex, pbl.u.uTex); gl.uniform2f(pbl.u.uDir, 1 / this.b2.w, 0); fullscreen(gl);
        this.b2.bind(); bindTex(gl, 0, this.b2b.tex, pbl.u.uTex); gl.uniform2f(pbl.u.uDir, 0, 1 / this.b2.h); fullscreen(gl);
      }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    const pc = this.progs.composite; gl.useProgram(pc.p);
    bindTex(gl, 0, this.scene.tex, pc.u.uScene); bindTex(gl, 1, this.b1.tex, pc.u.uBloom1); bindTex(gl, 2, this.b2.tex, pc.u.uBloom2);
    gl.uniform1f(pc.u.uBloom, bloomOn ? P.bloom : 0);
    gl.uniform1f(pc.u.uScan, s.scanlines ? P.scan || 0.35 : 0);
    gl.uniform1f(pc.u.uNoise, s.noise ? P.noise || 0.5 : 0);
    gl.uniform1f(pc.u.uTime, performance.now() / 1000);
    gl.uniform2f(pc.u.uRes, W, H); gl.uniform1f(pc.u.uVignette, P.vignette); gl.uniform3f(pc.u.uTint, P.sweep[0], P.sweep[1], P.sweep[2]);
    fullscreen(gl);

    // ----- 2D overlay -----
    this.drawOverlay(f);
    this.frame++;
  }

  // Phosphor: a target is (re)painted when the rotating beam passes its bearing from the radar head.
  sweepPaint(live, ang, tNow, alpha) {
    const prev = this.prevAng;
    const jump = prev == null || Math.abs(tNow - (this.prevT ?? tNow)) > SWEEP * 0.5;
    const seen = new Set();
    for (const a of live) {
      seen.add(a.id);
      const ix = a.px + (a.x - a.px) * alpha, iy = a.py + (a.y - a.py) * alpha;
      const b = (Math.atan2(ix, iy) + TAU) % TAU;
      let hit = jump || !this.paint.has(a.id);
      if (!hit && prev !== ang) hit = prev <= ang ? b > prev && b <= ang : b > prev || b <= ang;
      if (hit) {
        // stealth: the primary return is faint and sometimes missed altogether
        if (a.perf.stealth && this.paint.has(a.id) && !jump && hash(a.id, Math.floor(tNow / SWEEP)) < 0.35) continue;
        this.paint.set(a.id, { x: ix, y: iy, t: tNow });
      }
    }
    for (const id of [...this.paint.keys()]) if (!seen.has(id)) this.paint.delete(id);
    this.prevAng = ang; this.prevT = tNow;
  }

  drawOverlay(f) {
    const { world, settings: s } = f;
    const c = this.ctx, P = this.pal, ap = world.ap, dpr = this.dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, this.w, this.h);
    const fs = Math.round(11 * (f.ui || 1));
    c.font = `${fs}px "Plex Mono", ui-monospace, monospace`;
    c.textBaseline = 'middle';
    const on = (x, y) => x > -40 && y > -20 && x < this.w + 40 && y < this.h + 20;
    // fixes
    c.fillStyle = P.textMap;
    const showAll = this.range < 45;
    for (const fx of Object.values(ap.fixes)) {
      if (!showAll && fx.kind !== 'wpt') continue;
      const [x, y] = this.toScreen(fx.x, fx.y); if (!on(x, y)) continue;
      c.fillText(fx.name, x + 7, y - 7);
    }
    // runway ids
    c.fillStyle = P.textMap; c.textAlign = 'center';
    for (const rw of ap.runways) for (const e of rw.ends) {
      const [ox, oy] = hdgVec(norm360(e.hdg + 180));
      const [x, y] = this.toScreen(e.thrX + ox * 0.9, e.thrY + oy * 0.9);
      c.fillText(e.id + (e.ils && e.ils.status !== 'OK' ? ' U/S' : ''), x, y);
    }
    // ring labels + compass
    if (s.rangeRings) for (let r = 10; r < ap.sectorRadius; r += 10) { const [x, y] = this.toScreen(0, r); if (on(x, y)) c.fillText(String(r), x, y - 6); }
    for (let b = 0; b < 360; b += 30) {
      const [ux, uy] = hdgVec(b); const [x, y] = this.toScreen(ux * (ap.sectorRadius + 2.2), uy * (ap.sectorRadius + 2.2));
      if (on(x, y)) c.fillText(String(b).padStart(3, '0'), x, y);
    }
    if (s.showMva) {
      c.fillStyle = P.textDim; c.globalAlpha = 0.75;
      for (const m of ap.mva) { const [x, y] = this.toScreen(m.lx, m.ly); if (on(x, y)) c.fillText(String(m.alt / 100).padStart(2, '0'), x, y); }
      c.globalAlpha = 1;
    }
    if (s.showTerrain) {
      c.fillStyle = P.textDim;
      for (const sp of ap.spots) { const [x, y] = this.toScreen(sp.x, sp.y); if (on(x, y)) c.fillText(`${sp.name ? sp.name + ' ' : ''}${sp.elev}`, x, y + 10); }
    }
    if (s.showAirways) {
      c.fillStyle = P.textDim;
      for (const aw of ap.airways) {
        const i = Math.floor((aw.route.length - 1) / 2); const a = ap.fixes[aw.route[i]], b = ap.fixes[aw.route[i + 1]];
        const [x, y] = this.toScreen((a.x + b.x) / 2, (a.y + b.y) / 2); if (on(x, y)) c.fillText(aw.name, x, y - 8);
      }
    }
    c.fillStyle = P.textWarn;
    for (const r of ap.restricted) { const [x, y] = this.toScreen(r.lx, r.ly); if (on(x, y)) { c.fillText(r.name, x, y - 6); c.fillText(`${r.ceil / 100 | 0}/${r.floor ? r.floor / 100 | 0 : 'SFC'}`, x, y + 7); } }
    c.textAlign = 'left';

    // data blocks
    this.labels.draw(f);

    // drag readouts
    if (f.drag) {
      const d = f.drag; const [x, y] = this.toScreen(d.x1, d.y1);
      const brg = bearing(d.x0, d.y0, d.x1, d.y1), rng = dist(d.x0, d.y0, d.x1, d.y1);
      const txt = d.kind === 'rbl' ? `${String(Math.round(brg) || 360).padStart(3, '0')}° ${rng.toFixed(1)}nm` : `H${String(Math.round(d.hdg) || 360).padStart(3, '0')}`;
      c.font = `600 ${fs + 2}px "Plex Mono", monospace`;
      c.fillStyle = 'rgba(0,0,0,.6)'; const tw = c.measureText(txt).width; c.fillRect(x + 10, y - 22, tw + 10, fs + 8);
      c.fillStyle = d.kind === 'rbl' ? P.textWarn : P.textSel; c.fillText(txt, x + 15, y - 22 + (fs + 8) / 2);
    }
    // scale bar
    c.font = `${fs}px "Plex Mono", monospace`;

  vec3 field = r < 0.32 ? vec3(0.20, 0.31, 0.12) : r < 0.58 ? vec3(0.26, 0.36, 0.15) : r < 0.72 ? vec3(0.36, 0.41, 0.19)
             : r < 0.86 ? vec3(0.52, 0.47, 0.26) : vec3(0.34, 0.27, 0.18);
  float qfw = length(fwidth(qc));
  float rows = 0.93 + 0.07 * sin(dot(q, vec2(0.0, 0.4)) + r * 40.0);
  field *= mix(rows, 1.0, clamp(qfw * 40.0, 0.0, 1.0));
  field *= 0.84 + 0.22 * n2 + 0.1 * n3;
  vec2 ed2 = min(cf, 1.0 - cf) * cs; float ed = min(ed2.x, ed2.y), efw = fwidth(ed) + 1e-3;
  float hedge = (1.0 - smoothstep(9.0, 9.0 + efw * 1.5, ed)) * (0.55 + 0.45 * step(0.35, vn(q / 300.0)));
  field = mix(field, vec3(0.08, 0.14, 0.06), hedge * clamp(1.0 - efw / 60.0, 0.0, 1.0) * 0.85);
  field = mix(field, vec3(0.30, 0.35, 0.17), clamp(qfw * 3.0 - 0.4, 0.0, 0.8));   // average out far away
  vec3 c = field;
  // moorland and rock on the high ground
  c = mix(c, vec3(0.34, 0.30, 0.20) * (0.8 + 0.4 * n1), smoothstep(1150.0, 1700.0, hft + (n1 - 0.5) * 300.0));
  // woodland
  vec3 forest = vec3(0.075, 0.14, 0.06) * (0.65 + 0.7 * vn(p / 55.0)) * (0.85 + 0.3 * n1);
  c = mix(c, forest, smoothstep(0.05, 0.6, vM.x));

  vec2 g = rot(-uGridRot) * p;
  g = vec2(p.x * cos(uGridRot) + p.y * sin(uGridRot), -p.x * sin(uGridRot) + p.y * cos(uGridRot));
  vec2 gm = abs(mod(g + 200.0, 400.0) - 200.0);
  float sw = 14.0, gfw = fwidth(g.x) + 1e-3;
  float street = max(1.0 - smoothstep(sw, sw + gfw, gm.y), 1.0 - smoothstep(sw, sw + gfw, gm.x));
  vec3 urban = mix(vec3(0.24, 0.30, 0.17), vec3(0.42, 0.41, 0.39), smoothstep(0.35, 0.65, vn(p / 60.0)));
  urban = mix(urban, vec3(0.2, 0.2, 0.21), street);
  float u = smoothstep(0.02, 0.4, vM.y);
  c = mix(c, urban, u);

  vec2 ra = rot(uRwRot) * p;
  float stripe = step(0.5, fract(ra.x / 40.0)); float sfw = fwidth(ra.x / 40.0);
  vec3 af = vec3(0.24, 0.35, 0.14) * (0.95 + 0.05 * mix(stripe, 0.5, clamp(sfw * 3.0, 0.0, 1.0))) * (0.88 + 0.16 * n2 + 0.08 * n3);
  c = mix(c, af, vM.w);

  c = mix(c, vec3(0.62, 0.56, 0.42) * (0.9 + 0.2 * n2), vM.z * smoothstep(40.0, 8.0, hft));
  if (hft < 0.0) c = vec3(0.25, 0.27, 0.22);

  c = mix(c, vec3(0.36, 0.34, 0.31) * (0.8 + 0.4 * n2), smoothstep(0.86, 0.7, n.y));
  c = mix(c, c * 0.62, uWet * 0.6);
  vec3 col = lit(c, n, vW);
  // street lighting glow at night
  col += vec3(1.0, 0.62, 0.28) * uNight * u * (street * 0.55 + 0.05 * step(0.82, h21(floor(g / 40.0))));
  o = vec4(fog(col, vW), 1.0);
}`;

      pave: compile(gl, PAVE_VS, PAVE_FS), mesh: compile(gl, MESH_VS, MESH_FS), shadow: compile(gl, MESH_VS, SHADOW_FS),
      light: compile(gl, LIGHT_VS, LIGHT_FS), cloud: compile(gl, CLOUD_VS, CLOUD_FS), rain: compile(gl, RAIN_VS, RAIN_FS),
    };
    // fullscreen / unit quad
    this.quad = gl.createVertexArray(); gl.bindVertexArray(this.quad);
    const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    this.meshes = {};
    for (const [k, m] of Object.entries(meshLibrary())) this.meshes[k] = this.makeMesh(m);
    this.lightS = this.makeLights(); this.lightD = this.makeLights();
    this.dynLights = new Float32Array(12 * 4096); this.nDyn = 0;
    this.apKey = null; this.scene = null;
    this.yaw = 0; this.pitch = 0; this.fov = 50 * DEG;
    this.tYaw = 0; this.tPitch = 0; this.tFov = 50 * DEG;
    this.preset = 'arr'; this.binos = false; this.showFrame = true; this.needAim = true;
    this.screen = new Map();
    this.w = this.h = 1; this.dpr = 1;
    this.lost = false; this.lastNow = 0; this.lastSimT = -1;
    this.track = new Map(); this.ghosts = []; this.lineups = new Map();
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); this.lost = true; });
    this.buildBar();
  }

  // ---------- GL resources ----------
  makeMesh(m) {
    const gl = this.gl;
    const vb = [m.P, m.N, m.C].map(a => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, a, gl.STATIC_DRAW); return b; });
    const mk = () => {
      const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
      [[0, 3], [1, 3], [2, 4]].forEach(([loc, n], i) => { gl.bindBuffer(gl.ARRAY_BUFFER, vb[i]); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0); });
      const ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ib);
      const st = STRIDE * 4;
      [[3, 4, 0], [4, 4, 16], [5, 3, 32], [6, 3, 44], [7, 3, 56]].forEach(([loc, n, off]) => { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, st, off); gl.vertexAttribDivisor(loc, 1); });
      gl.bindVertexArray(null);

    const s = mk(), d = mk();
    return { n: m.n, vaoS: s.vao, ibS: s.ib, vaoD: d.vao, ibD: d.ib, nS: 0, nearS: 0, data: new Float32Array(STRIDE * 64), count: 0, ground: 0 };
  }
  makeLights() {
    const gl = this.gl, vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    for (let i = 0; i < 3; i++) { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, 4, gl.FLOAT, false, 48, i * 16); }
    gl.bindVertexArray(null);
    return { vao, buf, n: 0 };
  }

  build(ap) {
    const gl = this.gl, S = buildScene(ap);
    this.scene = S; this.ap = ap;
    // terrain
    if (!this.terrainVao) {
      this.terrainVao = gl.createVertexArray(); gl.bindVertexArray(this.terrainVao);
      this.terrainVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.terrainVbo);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
      this.terrainIbo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.terrainIbo);
      this.paveVao = gl.createVertexArray(); gl.bindVertexArray(this.paveVao);
      this.paveVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.paveVbo);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 32, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 32, 20);
    }
    gl.bindVertexArray(this.terrainVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.terrainVbo); gl.bufferData(gl.ARRAY_BUFFER, S.terrain, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.terrainIbo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, S.terrainIdx, gl.STATIC_DRAW);
    this.terrainN = S.terrainIdx.length;
    gl.bindVertexArray(this.paveVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.paveVbo); gl.bufferData(gl.ARRAY_BUFFER, S.pave, gl.STATIC_DRAW);
    this.paveN = S.pave.length / 8;
    gl.bindVertexArray(null);
    // runway marking textures
    if (this.rwTex) gl.deleteTexture(this.rwTex);
    const TW = 256, TH = 4096;
    this.rwTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.rwTex);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, Math.floor(Math.log2(TH)) + 1, gl.RGBA8, TW, TH, S.rwTex.length);
    S.rwTex.forEach((info, i) => gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, TW, TH, 1, gl.RGBA, gl.UNSIGNED_BYTE, runwayTexture(info, TW, TH)));
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (this.aniso) gl.texParameterf(gl.TEXTURE_2D_ARRAY, this.aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, gl.getParameter(this.aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    // static instances
    for (const [k, m] of Object.entries(this.meshes)) {
      const st = S.instances[k];
      m.nS = st ? st.count : 0; m.nearS = st ? st.near : 0;
      gl.bindBuffer(gl.ARRAY_BUFFER, m.ibS); gl.bufferData(gl.ARRAY_BUFFER, st ? st.data : new Float32Array(STRIDE), gl.STATIC_DRAW);
    }
    // static lights
    gl.bindBuffer(gl.ARRAY_BUFFER, this.lightS.buf); gl.bufferData(gl.ARRAY_BUFFER, S.lights, gl.STATIC_DRAW);
    this.lightS.n = S.lights.length / 12;
    this.pools = new Float32Array(48); S.pools.slice(0, 16).forEach((p, i) => this.pools.set(p, i * 3));
    this.ghosts = []; this.track.clear(); this.lineups.clear();
    this.needAim = true;
  }

  // ---------- view presets bar ----------
  buildBar() {
    const host = this.canvas.parentElement; if (!host) return;
    const bar = document.createElement('div'); bar.id = 'towerBar'; bar.hidden = true;
    this.btns = {};
    for (const [id, label, title] of PRESETS) {
      const b = document.createElement('button'); b.className = 'tb'; b.type = 'button'; b.textContent = label; b.title = title;
      b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.setPreset(id); });
      b.addEventListener('mousedown', e => e.stopPropagation());
      bar.appendChild(b); this.btns[id] = b;
    }
    host.appendChild(bar); this.bar = bar;
    this.syncBar();
  }
  syncBar() {
    if (!this.btns) return;
    for (const [id, b] of Object.entries(this.btns)) b.classList.toggle('on', id === 'binos' ? this.binos : id === 'frame' ? this.showFrame : id === this.preset);
  }
  setVisible(on) { if (this.bar) this.bar.hidden = !on; }
  setPreset(id) {
    if (id === 'binos') { this.binos = !this.binos; this.tFov = this.binos ? 8 * DEG : this.presetFov ?? 50 * DEG; if (!this.binos) this.needAim = true; }
    else if (id === 'frame') this.showFrame = !this.showFrame;
    else { this.preset = id; this.binos = false; this.needAim = true; }
    this.syncBar();
  }

  resize() {
    const r = this.canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(2, Math.round(r.width)), h = Math.max(2, Math.round(r.height));
    if (w === this.w && h === this.h && dpr === this.dpr) return;
    this.w = w; this.h = h; this.dpr = dpr;
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
  }

  // ---------- lighting from the sim clock & weather ----------
  environment(world) {
    const hr = ((world.clock / 3600) % 24 + 24) % 24;
    const sunEl = Math.sin(((hr - 6) / 12) * Math.PI) * 58 * DEG; // sunrise 06, noon 12 (58°), sunset 18
    const az = ((hr - 12) / 12) * 180 * DEG + Math.PI;               // east in the morning, south at noon, west at dusk
    const sunDir = [Math.sin(az) * Math.cos(sunEl), Math.sin(sunEl), -Math.cos(az) * Math.cos(sunEl)];
    const day = clamp((sunEl / DEG + 6) / 14, 0, 1);                 // 0 night .. 1 full day; twilight between -6° and +8°
    const dusk = clamp(1 - Math.abs(sunEl / DEG - 2) / 10, 0, 1);
    const wx = world.weather;
    const cover = wx.cloud >= 5000 ? 0.22 : wx.cloud >= 2500 ? 0.4 : wx.cloud >= 1000 ? 0.55 : 0.85;
    const rain = /\+RA|TSRA/.test(wx.precip) ? 1 : /RA|DZ/.test(wx.precip) ? 0.6 : 0;
    const overcast = Math.max(cover - 0.3, 0) * 1.4 + rain * 0.3;
    const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
    let zen = mix3([0.01, 0.015, 0.04], [0.18, 0.38, 0.74], day), hor = mix3([0.03, 0.04, 0.08], [0.66, 0.77, 0.88], day);
    hor = mix3(hor, [0.95, 0.5, 0.25], dusk * 0.6);
    const grey = mix3([0.03, 0.035, 0.045], [0.56, 0.59, 0.63], day);
    zen = mix3(zen, grey, clamp(overcast, 0, 0.85)); hor = mix3(hor, grey, clamp(overcast, 0, 0.85));
    const sunCol = mix3([0, 0, 0], mix3([1.05, 0.98, 0.88], [1.0, 0.55, 0.3], dusk), day * (1 - clamp(overcast, 0, 0.8)));
    const amb = mix3([0.055, 0.06, 0.09], [0.42, 0.47, 0.55], day);
    const visNm = wx.vis >= 9999 ? 25 : Math.max(0.1, wx.vis / 1852);
    const fogCol = mix3(hor, grey, 0.45);
    const night = 1 - day;
    const lowvis = clamp((5000 - wx.vis) / 4000, 0, 1);
    return { sunDir, sunCol, amb, zen, hor, day, night, fog: 2.5 / visNm, fogCol, cover, cloudBase: wx.cloud, rain, ts: /TS/.test(wx.precip),
      stars: clamp(1 - day * 2.5, 0, 1), rwyK: clamp(night + lowvis, 0.15, 1), haze: clamp(0.25 + lowvis, 0, 1),
      cloudCol: mix3([0.05, 0.05, 0.07], [0.93, 0.94, 0.96], day * (1 - rain * 0.45)), wet: rain ? 0.4 + rain * 0.6 : 0 };
  }

  // ---------- camera ----------
  aimTarget(world) {
    const S = this.scene, ap = this.ap, eye = S.eye;
    const arr = ap.ends[world.runwayConfig.arr] || Object.values(ap.ends)[0], dep = ap.ends[world.runwayConfig.dep] || arr;
    const dirTo = (x, y, hFt) => { const dx = x - eye[0], dy = y - eye[1], d = Math.hypot(dx, dy) || 1e-6; return [Math.atan2(dx, dy), Math.atan2((hFt - eye[2]) * FT, d), d]; };
    let yaw, pitch, fov = 50 * DEG;
    const p = this.preset;
    if (p === 'final') {
      const [ox, oy] = hdgVec(arr.hdg + 180);
      [yaw, pitch] = dirTo(arr.thrX + ox * 3, arr.thrY + oy * 3, S.elev + 3 * FT_PER_NM * Math.tan(3 * DEG)); fov = 14 * DEG;
    } else if (p === 'rwy') {
      const rw = arr.runway, a = dirTo(rw.ends[0].thrX, rw.ends[0].thrY, S.elev), b = dirTo(rw.ends[1].thrX, rw.ends[1].thrY, S.elev);
      const dy = wrapPi(b[0] - a[0]);
      yaw = a[0] + dy / 2;
      const aspect = this.w / this.h, hfov = Math.abs(dy) * 1.15;
      fov = clamp(2 * Math.atan(Math.tan(hfov / 2) / aspect), 30 * DEG, 60 * DEG);
      pitch = Math.min(a[1], b[1]) + fov * 0.2;
    } else if (p === 'dep') {
      const h = S.holds[dep.id];
      const tx = h ? (h.hold.x + dep.thrX) / 2 : dep.thrX, ty = h ? (h.hold.y + dep.thrY) / 2 : dep.thrY;
      [yaw, pitch] = dirTo(tx, ty, S.elev); pitch += 4 * DEG; fov = 30 * DEG;
    } else if (p === 'apron') {
      let sx = 0, sy = 0; for (const s of S.stands) { sx += s.x; sy += s.y; }
      const n = S.stands.length || 1;
      [yaw, pitch] = dirTo(sx / n, sy / n, S.elev); pitch += 6 * DEG; fov = 60 * DEG;
    } else {
      const [ux, uy] = hdgVec(arr.hdg), k = 1500 * FT;
      const tx = arr.thrX + ux * k, ty = arr.thrY + uy * k;
      [yaw, pitch] = dirTo(tx, ty, S.elev);
      fov = 45 * DEG; pitch += fov * 0.12;
    }
    return { yaw, pitch, fov };
  }
  updateCamera(world, dt, posOf) {
    if (this.preset === 'follow') {
      const p = posOf(this.followId);
      if (p) {
        const S = this.scene, dx = p[0] - S.eye[0], dy = p[1] - S.eye[1], d = Math.hypot(dx, dy) || 1e-6;
        this.tYaw = Math.atan2(dx, dy); this.tPitch = Math.atan2((p[2] - S.eye[2]) * FT, d);
        if (!this.binos) this.tFov = clamp(2 * Math.atan(p[3] * 6 / Math.hypot(d, (p[2] - S.eye[2]) * FT)), 4 * DEG, 50 * DEG);
      }
    } else if (this.needAim) {
      const t = this.aimTarget(world);
      this.tYaw = t.yaw; this.tPitch = t.pitch; this.presetFov = t.fov;
      if (!this.binos) this.tFov = t.fov;
      this.needAim = false;
    }
    const k = 1 - Math.exp(-dt * 4);
    this.yaw += wrapPi(this.tYaw - this.yaw) * k;
    this.pitch += (this.tPitch - this.pitch) * k;
    this.fov += (this.tFov - this.fov) * k;
  }

  // ---------- per-frame traffic ----------
  // Interpolated state of every visible sim aircraft, with ground traffic placed on the scene's holding points and
  // line-up paths. Returns entries {a, x, y, hFt, hdg, pitch, bank, ground}.
  trafficState(f) {
    const world = f.world, S = this.scene, al = f.alpha, simT = world.t;
    const out = [];
    const holdQ = {};
    for (const a of world.aircraft) if (a.phase === 'HOLDING_POINT' && S.holds[a.depRwy]) (holdQ[a.depRwy] || (holdQ[a.depRwy] = [])).push(a);
    for (const q of Object.values(holdQ)) q.sort((p, r) => (p.id > r.id ? 1 : p.id < r.id ? -1 : 0));
    const seen = new Set();
    for (const a of world.aircraft) {
      if (a.phase === 'GONE') continue;
      seen.add(a.id);
      const x = a.px + (a.x - a.px) * al, y = a.py + (a.y - a.py) * al;
      if (Math.hypot(x - S.eye[0], y - S.eye[1]) > 45) continue;
      let hdg = a.phdg + ((((a.hdg - a.phdg) % 360) + 540) % 360 - 180) * al;
      let e = { a, x, y, hFt: Math.max(S.elev, a.palt + (a.alt - a.palt) * al), hdg, pitch: 0, bank: 0, ground: a.phase !== 'AIR' };
      const prev = this.track.get(a.id);
      if (a.phase === 'HOLDING_POINT' && holdQ[a.depRwy]) {
        const H = S.holds[a.depRwy], i = holdQ[a.depRwy].indexOf(a);
        const slot = i === 0 ? H.hold : H.queue[Math.min(i - 1, H.queue.length - 1)];
        e.x = slot.x; e.y = slot.y; e.hdg = slot.hdg; e.hFt = S.elev;
      } else if (a.phase === 'LINEUP' && S.holds[a.depRwy]) {
        if (!this.lineups.has(a.id)) this.lineups.set(a.id, prev && prev.phase === 'HOLDING_POINT' ? simT : -1e9);
        const H = S.holds[a.depRwy];
        const pts = [H.lineup[0], H.lineup[1], [a.x, a.y]];
        const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        const s = Math.min(cum[2], (simT - this.lineups.get(a.id)) * 15 / 3600);
        const i = s <= cum[1] ? 0 : 1, q = (s - cum[i]) / Math.max(1e-9, cum[i + 1] - cum[i]);
        e.x = lerp(pts[i][0], pts[i + 1][0], q); e.y = lerp(pts[i][1], pts[i + 1][1], q);
        e.hdg = s >= cum[2] - 1e-6 ? H.rwHdg : Math.atan2(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]) / DEG;
        e.hFt = S.elev;
      } else if (a.phase === 'AIR') {
        e.pitch = Math.atan2((a.vs || 0) / 60, Math.max(60, a.gs) * 1.6878) + 2 * DEG;
        e.bank = -Math.atan((a.gs * 0.5144) * ((a.turnRate || 0) * DEG) / 9.81);
      } else e.hFt = S.elev;
      if (a.phase === 'TAKEOFF') e.pitch = a.ias > a.perf.vr - 8 ? 5 * DEG : 0;
      out.push(e);
      this.track.set(a.id, { phase: a.phase, x: e.x, y: e.y, hdg: a.hdg, type: a.type, cls: a.cls, callsign: a.callsign, landRwy: a.landRwy || a.app?.end?.runway, t: simT });
    }
    // aircraft that vacated the runway become ghost taxi traffic to a free stand
    for (const [id, tr] of this.track) {
      if (seen.has(id)) continue;
      this.track.delete(id); this.lineups.delete(id);
      if (tr.phase === 'ROLLOUT') this.spawnGhost(tr, simT);
    }
    return out;
  }

  spawnGhost(tr, simT) {
    const S = this.scene;
    const ri = S.frames.findIndex(fr => fr.rw === tr.landRwy || (tr.landRwy && fr.rw.name === tr.landRwy.name));
    const T = S.taxi[ri >= 0 ? ri : 0], fr = T.f;
    const [s0, t0] = fr.st(tr.x, tr.y);
    const [hx, hy] = hdgVec(tr.hdg), dd = hx * fr.ux + hy * fr.uy >= 0 ? 1 : -1;
    const ahead = T.exits.filter(e => (e.d === dd || e.d === 0) && (e.sa - s0) * dd > -50).sort((p, q) => (p.sa - s0) * dd - (q.sa - s0) * dd);
    const ex = ahead[0] || T.exits.reduce((b, e) => (e.sa * dd > b.sa * dd ? e : b), T.exits[0]);
    const taken = new Set(this.ghosts.map(g => g.stand));
    const free = S.stands.filter(s => !s.occupied && !taken.has(s));
    const exitXY = fr.P(ex.sb, T.tp);
    let stand = null, bd = 1e9;
    for (const s of free) { const d = Math.hypot(s.x - exitXY[0], s.y - exitXY[1]); if (d < bd) { bd = d; stand = s; } }
    const pts = [[tr.x, tr.y, 25], [...fr.P(ex.sa, t0 * 0.2), 25], [...exitXY, 20]];
    if (stand) {
      const F0 = S.F0, [sx] = F0.st(stand.x, stand.y);
      pts.push([...F0.P(sx, S.sd * 600), 18], [...stand.entry, 8], [stand.x, stand.y, 0]);
    } else {
      const [xs] = fr.st(...exitXY);
      pts.push([...fr.P(xs + dd * 1500, T.tp), 0]);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    // time at each vertex, segment i driven at the speed stored on its start point
    const tAt = [0];
    for (let i = 1; i < pts.length; i++) tAt.push(tAt[i - 1] + (cum[i] - cum[i - 1]) / (pts[i - 1][2] / 3600));
    if (this.ghosts.length > 24) this.ghosts.shift();
    this.ghosts.push({ type: tr.type, cls: tr.cls, callsign: tr.callsign, pts, tAt, t0: simT, stand, endHdg: stand ? stand.hdg : tr.hdg });
  }
  ghostState(simT) {
    const out = [];
    this.ghosts = this.ghosts.filter(g => {
      const el = simT - g.t0, T = g.tAt[g.tAt.length - 1];
      if (el > T + (g.stand ? 300 : 0)) return false;
      let i = 0; while (i < g.tAt.length - 2 && el > g.tAt[i + 1]) i++;
      const q = clamp((el - g.tAt[i]) / Math.max(1e-6, g.tAt[i + 1] - g.tAt[i]), 0, 1);
      const A = g.pts[i], B = g.pts[i + 1];
      const parked = el >= T;
      out.push({ ghost: g, x: lerp(A[0], B[0], q), y: lerp(A[1], B[1], q), hdg: parked ? g.endHdg : Math.atan2(B[0] - A[0], B[1] - A[1]) / DEG, parked });
      return true;
    });
    return out;
  }

  // ---------- instance helpers ----------
  pushInst(mesh, x, hFt, y, yawDeg, pitch, bank, sel, flags, sx, sy, sz, tint, body) {
    const m = this.meshes[mesh]; if (!m) return;
    if ((m.count + 1) * STRIDE > m.data.length) { const nd = new Float32Array(m.data.length * 2); nd.set(m.data); m.data = nd; }
    const o = m.count * STRIDE, d = m.data;
    d[o] = x; d[o + 1] = hFt * FT; d[o + 2] = -y; d[o + 3] = yawDeg * DEG;

function grade(world) {
  const st = world.score.stats;
  const moves = st.landings + st.departures + st.handoffs;
  const unsafe = st.los * 3 + st.rwy * 3 + st.msaw * 2 + st.wake + st.aiw;
  const perMove = moves ? world.score.total / moves : 0;
  if (moves === 0) return '–';
  if (unsafe === 0 && perMove >= 70) return 'A+';
  if (unsafe === 0 && perMove >= 45) return 'A';
  if (unsafe <= 1 && perMove >= 30) return 'B';
  if (unsafe <= 3 && perMove >= 10) return 'C';
  if (unsafe <= 6) return 'D';
  return 'F';
}

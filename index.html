<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<style>
  :root { color-scheme: dark; --bg: #0b0f14; --card: #131a22; --line: #23303d; --fg: #e6edf3; --dim: #8b9bab; --acc: #4fd18b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    padding: calc(24px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 20px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--acc); }
  a.card h2 { margin: 0 0 6px; font-size: 20px; color: var(--acc); }
  a.card p { margin: 0; color: var(--dim); }
  .tag { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <a class="card" href="atc/">
    <h2>Terminal Radar</h2>
    <p>Approach and tower air traffic control simulator. Vector arrivals onto the ILS, release departures and keep everyone separated, with an instructor who teaches you one task at a time.</p>
    <span class="tag">Desktop · keyboard &amp; mouse</span>
  </a>
</main>
</body>
</html>
